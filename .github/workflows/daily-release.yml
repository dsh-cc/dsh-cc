# =============================================================================
# Daily Release (propose) — dsh-cc
#
# Weekdays at 08:00 Beijing (00:00 UTC; China has no DST). Asia/Singapore
# Mon–Sun week drives the RC ladder (scheme B) via
# scripts/daily-release-decide.mjs:
#
#   - Monday (or any weekday with no rc on the candidate line yet): propose
#     next-line X.Y.Z-rc.1 when main has unreleased work vs last stable.
#   - Tue–Fri: commits after previous rc → rc.N+1; else stabilize to X.Y.Z.
#   - If this calendar week already has a stable vX.Y.Z → skip all proposes.
#
# Opens a release PR (branch release/v<next>, lockstep version bump only).
# After merge, release-tag.yml tags the merge commit and dispatches
# publish.yml. This workflow never tags and never pushes main.
#
# Guards: open-PR dedupe on the release/v* branch name + release.mjs
# validations (HEAD === origin/main, tag uniqueness, clean tree).
# Manual dispatch defaults to dry_run=true (gates + release.mjs --dry-run,
# no PR) so the logic can be exercised without proposing a release.
#
# 2026-09-15 root cause: gate picked LAST_TAG=v0.7.1-rc.3 via version-sorted
# v* tags; daily-release-next-version.mjs rejected prerelease. Decide now
# selects last *stable* separately and ladders rc on the candidate line.
# =============================================================================

name: Daily Release (propose)

on:
  schedule: [{ cron: "0 0 * * 1-5" }]   # 08:00 Beijing, weekdays
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto = feat → minor, else patch)
        type: choice
        options: [auto, patch, minor]
        default: auto
      dry_run:
        description: Validate only — do not push a branch or open a PR
        type: boolean
        default: true

permissions:
  contents: write        # push release/* branches
  pull-requests: write   # gh pr create / list

concurrency:
  group: daily-release
  cancel-in-progress: false

env:
  BUMP: ${{ inputs.bump || 'auto' }}
  # schedule events have no inputs.dry_run → false → real proposal;
  # manual dispatch defaults to dry-run.
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}

jobs:
  propose:
    name: Gate, compute next version, propose release PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0   # ancestry check + tag --merged need full history

      # checkout@v4 leaves a detached HEAD; release.mjs requires branch == main.
      # --force --tags: tag listing and ancestry need a complete tag set.
      - name: Sync main (undetach + tags)
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          git checkout -B main origin/main

      # RC ladder decide: stdout = GITHUB_OUTPUT key=value lines; diagnostics
      # on stderr. Never fails the job on action=skip (week_has_stable /
      # no_unreleased_work) — those are successful no-ops.
      - id: decide
        name: Decide — RC ladder (Asia/Singapore week)
        run: |
          set -euo pipefail
          # Capture machine-readable lines for step outputs; also mirror to summary.
          OUT=$(mktemp)
          node scripts/daily-release-decide.mjs --bump "$BUMP" | tee "$OUT"
          cat "$OUT" >> "$GITHUB_OUTPUT"
          {
            echo "### Daily Release decide"
            echo '```'
            cat "$OUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          action=$(grep -E '^action=' "$OUT" | head -n1 | cut -d= -f2-)
          reason=$(grep -E '^reason=' "$OUT" | head -n1 | cut -d= -f2-)
          if [ "$action" = "skip" ]; then
            echo "skip: $reason (exit 0 — no propose)" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$action" != "propose" ]; then
            echo "::error::unexpected action='$action'"
            exit 1
          fi

      # Recovery: only when HEAD is contained in last stable (no unreleased
      # work) but the GitHub Release is missing — re-dispatch publish.
      # Do NOT recover on week_has_stable (that would re-fire mid-week noise);
      # recovery may still re-dispatch the last stable tag if its Release is
      # missing even mid-week, which is intentional and does not open a propose.
      - name: Recover stuck release
        if: >-
          steps.decide.outputs.action == 'skip' &&
          steps.decide.outputs.reason == 'no_unreleased_work' &&
          env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LAST_STABLE: ${{ steps.decide.outputs.last_stable }}
        run: |
          set -euo pipefail
          if [ -z "${LAST_STABLE:-}" ]; then
            echo "no last_stable in decide output; recovery skip" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if gh release view "$LAST_STABLE" > /dev/null 2>&1; then
            echo "$LAST_STABLE already published; recovery skip" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "$LAST_STABLE has no GitHub Release; re-dispatching publish.yml" >> "$GITHUB_STEP_SUMMARY"
            gh workflow run publish.yml -f tag="$LAST_STABLE"
          fi

      - id: plan
        name: Open-PR dedupe
        if: steps.decide.outputs.action == 'propose'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.decide.outputs.version }}
          HEAD_REF: release/v
        run: |
          set -euo pipefail
          if [ -z "${NEXT:-}" ]; then
            echo "::error::decide action=propose but version is empty"
            exit 1
          fi
          echo "next version: $NEXT" >> "$GITHUB_STEP_SUMMARY"
          open_prs=$(gh pr list --head "${HEAD_REF}${NEXT}" --state open --json number --jq length)
          if [ "$open_prs" -gt 0 ]; then
            echo "proposal already open (release/v$NEXT); skipping" >> "$GITHUB_STEP_SUMMARY"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "next=$NEXT"
            echo "head_ref=${HEAD_REF}${NEXT}"
          } >> "$GITHUB_OUTPUT"

      - name: Dry run (no branch, no PR)
        if: >-
          steps.decide.outputs.action == 'propose' &&
          steps.plan.outputs.exists == 'false' &&
          env.DRY_RUN == 'true'
        run: |
          set -euo pipefail
          NEXT="${{ steps.plan.outputs.next }}"
          node scripts/release.mjs "$NEXT" --dry-run
          echo "DRY-RUN: validations passed; no branch/PR created (manual dispatch defaults to dry-run; the schedule path proposes for real)" >> "$GITHUB_STEP_SUMMARY"

      - name: Propose release PR
        if: >-
          steps.decide.outputs.action == 'propose' &&
          steps.plan.outputs.exists == 'false' &&
          env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.plan.outputs.next }}
          HEAD_REF: ${{ steps.plan.outputs.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # release.mjs: rewrite every manifest + FALLBACK_VERSION, commit, local tag
          node scripts/release.mjs "$NEXT"
          # Tag is created by release-tag.yml after merge. Pushing it here would
          # fail publish.yml's "tag must be on main" ancestry gate.
          git tag -d "v$NEXT"
          # -f overwrites a leftover branch from a previously closed PR;
          # release/* is not covered by main's branch protection.
          git push -f origin "HEAD:refs/heads/$HEAD_REF"

          url=$(gh pr create --base main --head "$HEAD_REF" \
            --title "chore(release): v$NEXT" \
            --body "$(cat <<'EOF'
          Auto-opened by [daily-release.yml](.github/workflows/daily-release.yml) (RC ladder): lockstep version bump only (all publishable manifests + FALLBACK_VERSION).

          - After merge, [release-tag.yml](.github/workflows/release-tag.yml) tags the merge commit and dispatches publish.yml.
          - publish.yml runs the full gate chain, then waits on the `npm-publish` environment for a human approval before publishing to npmjs and creating the GitHub Release.
          - dist-tag: `-rc.N` → `next`; stable → `latest`.
          - If publish fails: `gh workflow run publish.yml -f tag=<tag>`.
          EOF
          )")
          echo "opened release PR: $url" >> "$GITHUB_STEP_SUMMARY"
