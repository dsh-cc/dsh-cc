# =============================================================================
# PreSubmit — dsh-cc
#
# GitHub port of orchestrix's codebase presubmit. Four intentional deviations
# from the reference repo:
#   1. Parallel job split (2026-11): three jobs — `static-gates` (pure static
#      scans, no node_modules, no install; seconds to red on the most common
#      failure classes), `quality-gates` (assembly + typecheck/bundle/
#      exports/smoke/artifacts), and `unit-tests` (vitest + informational
#      tiers). `quality-gates` and `unit-tests` run in parallel from t=0, each
#      with its own assembly prefix. That duplicates `pnpm install`
#      (~1min, node_modules is never cached anyway) and `tsc -b` per job —
#      accepted: on cache-hit runs the wall time is max(job) instead of
#      sum(steps); on cache-miss runs both jobs build the harness in
#      parallel, which is no worse than the old serial cold build. Only
#      `quality-gates` saves the harness-lib cache (restore-only in
#      `unit-tests`, with a fallback build that never saves) — no save races.
#      An earlier single-job design merged the reference repo's parallel
#      quality-gates / test-and-build jobs because they would only build the
#      harness twice; the cache-by-pin-SHA + fallback-build pattern is what
#      makes the split viable now.
#   2. The reference repo installs Node + an internal mirror/bnpm by hand;
#      this workflow uses setup-node's native pnpm cache instead — both
#      repos' dependencies come entirely from the public npm registry.
#   3. ~20 packages depend on the sibling repo via
#      link:../../../../deepseek-harness/... → side-by-side checkouts: the two
#      `path:` values make the repos siblings, so the link: walk-up of 4
#      levels lands exactly.
#   4. Harness build outputs (each package's lib/, ~64MB) are cached by pin
#      SHA via actions/cache restore/save; a hit skips build:lib (~62% of the
#      pipeline). save follows the build step directly (success() gating
#      keeps half-built artifacts from poisoning the cache, and a
#      red-test iteration still keeps the already-built cache). node_modules
#      (1.4G) is never cached — install runs on every run. The artifact glob
#      is fixed-depth and exactly matches the build:lib output set declared
#      by the tsdown workspace — no `**`: @actions/glob's `**` follows
#      symlinks and explodes combinatorially on the pnpm symlink tree (a save
#      measured 19min without finishing). Harness package depth / tsdown
#      workspace changes must be mirrored here.
#
# deepseek-harness pin upgrade flow: once harness master checks out, update
# DSH_HARNESS_REF in the env block above to the new SHA and commit it
# together with this repo's adaptations. Changing the ref changes the cache
# key — one cold build each for the PR and the merge to main (caches are
# branch-scoped), hits from then on; the idle old entry expires after 7
# days. Note this is a fixed org-internal fork: deletion, going private, or
# force-push GC all break CI.
# =============================================================================
name: PreSubmit

on:
  pull_request:
    # Exercise stacked VWA PRs against their immediate dependency as well as main.
    branches: [main, 'split/vwa-*']
  push:
    branches: [main]

env:
  # deepseek-harness pin: single source of truth for the checkout ref and
  # the harness-artifact cache key. publish.yml greps this file for exactly
  # one occurrence of this line — keep it workflow-level and unique.
  DSH_HARNESS_REF: 31cfe2aafead959a4dbd9d8cfaae258eb28a19fd # 0.2.1-rc.5 release commit

permissions:
  contents: read

# On rapid consecutive pushes to the same PR/branch keep only the newest
# run — avoids building deepseek-harness twice
concurrency:
  group: presubmit-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Every run: step uses `bash -eo pipefail` (GitHub's default without an
# explicit shell is `bash -e`, which lets `cmd | tee log` mask cmd's failure).
# Enforced by scripts/check-workflow-pipefail.mjs. Workflow-level, so all
# three jobs inherit it.
defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # Pure static gates: no node_modules, no sibling checkout, no install.
  # Checkout + Node is the entire setup cost — static failure classes
  # (README trio drift, parity staleness, size budget, boundary violations)
  # go red in seconds, in parallel with the assembly-heavy jobs below.
  # Keep this list in sync with the "before install" gates described in
  # docs/plans/ — a gate may move here only if it needs nothing beyond
  # git + Node stdlib.
  # ---------------------------------------------------------------------------
  static-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: dsh-cc
          # fetch-depth: 0 — the eval-gate freeze/rot check diffs against
          # origin/main (scripts/check-eval-gate.mjs), which needs full history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pure static scan, no node_modules needed: catches "a spec imports an
      # undeclared link:/workspace dependency" — a CI-only failure class
      # (ERR_MODULE_NOT_FOUND) — before the harness build starts.
      - name: Spec dependency declarations (check:spec-deps)
        working-directory: dsh-cc
        run: node scripts/check-spec-deps.mjs

      # Freeze/rot discipline for the token-efficiency eval gate (plan §5):
      # the frozen eval-gate.yaml lands alone; metrics.ts changes must refresh
      # the baseline vector. Needs git history → runs after the fetch-depth: 0
      # checkout, before install (pure static like spec-deps).
      - name: Eval-gate freeze discipline (check:eval-gate)
        if: github.event_name == 'pull_request'
        working-directory: dsh-cc
        run: node scripts/check-eval-gate.mjs

      # Every workflow runs steps under pipefail (defaults.run.shell: bash);
      # pure static, before install.
      - name: Workflow pipefail (check:workflow-pipefail)
        working-directory: dsh-cc
        run: node scripts/check-workflow-pipefail.mjs && node scripts/check-workflow-pipefail.test.mjs

      - name: Canonical project identity (check:identity)
        working-directory: dsh-cc
        run: node scripts/check-project-identity.mjs

      - name: Publishable manifest invariants (check:publish)
        working-directory: dsh-cc
        run: node scripts/check-publish-manifests.mjs

      # Bilingual README trio gate (README.md/README.zh.md/README.i18n.yaml
      # pairing record — see docs/i18n/README.md); pure static: git
      # hash-object needs no node_modules.
      - name: Package README trio (check:readme)
        working-directory: dsh-cc
        run: node scripts/check-readme.mjs

      - name: Package README trio self-test
        working-directory: dsh-cc
        run: node scripts/check-readme.test.mjs

      # Ratchet mode: the baseline freezes existing over-budget files
      # (shrink-only); once the baseline is empty the gate becomes a hard
      # ≤500-line cap.
      - name: File size budget (check:size)
        working-directory: dsh-cc
        run: node scripts/check-file-size.mjs

      # Two more pure-static gates: vendored pi-tui purity (no bare imports
      # outside the whitelist) + the TUI harness boundary (@deepseek-ai/* may
      # appear only in harness/ and the plugin surface). Catch violations in
      # the static phase — don't wait for vendor-tree pollution to surface at
      # the consumers.
      - name: TUI boundary (check:tui-boundary)
        working-directory: dsh-cc
        run: node scripts/check-tui-boundary.mjs

      # Cross-package deep src/ imports survive verbatim in tsc emit and hit
      # Node's node_modules type-stripping restriction at runtime (plugin
      # tree boot fails outright).
      - name: Deep src imports (check:deep-imports)
        working-directory: dsh-cc
        run: node scripts/check-deep-src-imports.mjs

      - name: Vendored pi-tui purity (check:vendor-purity)
        working-directory: dsh-cc
        run: node scripts/check-vendor-purity.mjs

  # ---------------------------------------------------------------------------
  # Assembly + quality gates: everything that needs node_modules and the
  # built harness but is not the test suite. Owns the harness-lib cache
  # save (the only job that writes it).
  # ---------------------------------------------------------------------------
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: dsh-cc
          # The eval-gate history need moved to static-gates; quality gates
          # don't diff against main.
      - uses: actions/checkout@v4
        with:
          repository: dsh-cc/deepseek-harness
          ref: ${{ env.DSH_HARNESS_REF }}
          path: deepseek-harness

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            dsh-cc/pnpm-lock.yaml
            deepseek-harness/pnpm-lock.yaml

      - name: Cache harness build outputs (restore)
        id: cache-harness
        uses: actions/cache/restore@v4
        with:
          path: |
            deepseek-harness/packages/*/*/lib
            deepseek-harness/vendor/*/lib
            deepseek-harness/apps/cli/lib
            # 0.1.5: flock lease addon ships its built lib here; broken
            # without it even on cache-hit runs (jsonl imports eagerly).
            deepseek-harness/native/system/packages/*/lib
            deepseek-harness/native/system/packages/*/bin
          key: harness-lib-${{ env.DSH_HARNESS_REF }}

      - name: Install deepseek-harness deps
        working-directory: deepseek-harness
        run: pnpm install --frozen-lockfile

      - name: 'Build deepseek-harness lib (consumption point of link:; build:web skipped)'
        if: steps.cache-harness.outputs.cache-hit != 'true'
        working-directory: deepseek-harness
        run: pnpm run build:lib && pnpm run build:native-system
        # 0.1.5: background-Task paths call flock for real; the addon
        # binary is gitignored upstream, so cache-miss runs must compile it
        # (ubuntu runners carry build-essential).

      - name: Cache harness build outputs (save)
        if: steps.cache-harness.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            deepseek-harness/packages/*/*/lib
            deepseek-harness/vendor/*/lib
            deepseek-harness/apps/cli/lib
            # 0.1.5: flock lease addon ships its built lib here; broken
            # without it even on cache-hit runs (jsonl imports eagerly).
            deepseek-harness/native/system/packages/*/lib
            deepseek-harness/native/system/packages/*/bin
          key: harness-lib-${{ env.DSH_HARNESS_REF }}

      - name: Install dsh-cc deps
        working-directory: dsh-cc
        env:
          HUSKY: 0
        run: pnpm install --frozen-lockfile

      # The capability gates (I1–I11, evidence anchors, registry integrity,
      # no generated-artifact drift) depend on js-yaml, so they cannot join
      # the pure-static no-node_modules lane above; they run right after
      # install, still ahead of typecheck/test for fast feedback.
      - name: Capability evidence (check:capabilities)
        working-directory: dsh-cc
        run: node scripts/check-capability-evidence.mjs

      - name: Parity matrix freshness (check:parity)
        working-directory: dsh-cc
        run: node scripts/generate-parity-matrix.mjs --check

      # Paired self-tests for the two checkers (see
      # docs/plans/2026-09-03-claude-code-capability-manifest.md §5.3).
      - name: Capability evidence self-test
        working-directory: dsh-cc
        run: node scripts/check-capability-evidence.test.mjs

      - name: Parity matrix generator self-test
        working-directory: dsh-cc
        run: node scripts/generate-parity-matrix.test.mjs

      # Cordis inject declarations (#140 class: ctx.<svc> read on a plugin
      # context without `export const inject` throws only in a real boot).
      # TypeScript AST scan — needs node_modules, so it runs after install.
      - name: Plugin inject declarations (check:inject)
        working-directory: dsh-cc
        run: node scripts/check-inject.mjs && node scripts/check-inject.test.mjs

      # Concrete model ids only in the alias registry (cc-model-aliases;
      # allowlist: tui/src/provider-presets.ts, test-support). AST scan.
      - name: Model id literals (check:model-literals)
        working-directory: dsh-cc
        run: node scripts/check-model-literals.mjs && node scripts/check-model-literals.test.mjs

      - name: Typecheck ≡ Build (tsc -b project references)
        working-directory: dsh-cc
        run: pnpm typecheck

      # lib/ is gitignored; the browser client bundle (module-table-handoff
      # factory) only exists after tsdown runs. check:exports needs it on disk,
      # and a follow-up profile sync rsyncs whatever is on disk — regenerate it
      # right after tsc so both stay green.
      - name: Bundle client (tsdown → lib/client.js)
        working-directory: dsh-cc
        run: pnpm run bundle:client

      # Level with publish.yml: every lib/* an exports entry points at must
      # be produced by this very build. This used to run only at publish
      # time — #112's missing tsconfig reference (serena-first never emits
      # lib/) got merged that way; ghost exports targets must be blocked
      # pre-merge.
      - name: Export targets (check:exports)
        working-directory: dsh-cc
        run: pnpm check:exports

      # Real-boot smoke (v0.4.1 incident class: "merged green, boot crashes for
      # every user"): sync the built packages into a throwaway DSH_HOME profile
      # and require the TUI's first frame. Zero LLM calls; needs the harness
      # build:lib output above, python3 (pty) and rsync from the runner image.
      - name: Profile boot smoke (smoke:profile-boot)
        working-directory: dsh-cc
        # Leave room for diagnostics/cleanup after the unchanged 180s + 90s boot budgets.
        timeout-minutes: 6
        run: pnpm smoke:profile-boot

      # Boot first so startup failures surface before the slower npm-pack checks.
      # Every packed artifact must resolve its own relative imports (issue
      # #249: lib/classes.js imported ../data/classes.json, never packed).
      - name: Publish artifacts (check:artifacts)
        working-directory: dsh-cc
        run: pnpm check:artifacts

  # ---------------------------------------------------------------------------
  # Unit tests. Runs in parallel with quality-gates (no `needs:`): each job
  # pays its own assembly prefix (harness cache restore + two installs +
  # tsc). Restore-only here — quality-gates is the single cache writer; the
  # fallback build below covers cache-miss/evicted runs without ever saving
  # (no save races by construction). Cold-cache wall time is unchanged vs
  # the old serial job (both jobs build the harness concurrently); warm runs
  # drop from sum(quality + tests) to max(quality, tests).
  # ---------------------------------------------------------------------------
  unit-tests:
    runs-on: ubuntu-latest
    # Cold-cache worst case: harness build + two installs + tsc (~15m) + the
    # 25m vitest step cap, plus slack so the if:always() artifact upload
    # survives a hung cold suite instead of being cancelled with the job.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: dsh-cc

      - uses: actions/checkout@v4
        with:
          repository: dsh-cc/deepseek-harness
          ref: ${{ env.DSH_HARNESS_REF }}
          path: deepseek-harness

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            dsh-cc/pnpm-lock.yaml
            deepseek-harness/pnpm-lock.yaml

      - name: Cache harness build outputs (restore)
        id: cache-harness
        uses: actions/cache/restore@v4
        with:
          path: |
            deepseek-harness/packages/*/*/lib
            deepseek-harness/vendor/*/lib
            deepseek-harness/apps/cli/lib
            deepseek-harness/native/system/packages/*/lib
            deepseek-harness/native/system/packages/*/bin
          key: harness-lib-${{ env.DSH_HARNESS_REF }}

      - name: Install deepseek-harness deps
        working-directory: deepseek-harness
        run: pnpm install --frozen-lockfile

      # This restore hits only when a *prior* run saved this key (the
      # parallel quality-gates job is still mid-build when this step runs).
      # On a cold key this job builds the harness itself — never saves;
      # quality-gates is the single cache writer.
      - name: 'Build deepseek-harness lib (fallback on cache miss)'
        if: steps.cache-harness.outputs.cache-hit != 'true'
        working-directory: deepseek-harness
        run: pnpm run build:lib && pnpm run build:native-system

      - name: Install dsh-cc deps
        working-directory: dsh-cc
        env:
          HUSKY: 0
        run: pnpm install --frozen-lockfile

      # Not the typecheck gate (that lives in quality-gates) — but vitest
      # needs tsc -b output: specs resolve workspace packages whose exports
      # point at lib/ (e.g. @dsh-cc/post-edit-verify; PR #215 lesson).
      - name: Build (tsc -b project references)
        working-directory: dsh-cc
        run: pnpm typecheck

      # Observability add-on (docs/plans/2026-10-03-ci-test-stability.md §5):
      # the 25m step cap kills the hang-all case so the upload below still
      # runs (R4 bounds every touched file at 18m at enforced ceilings); the
      # tee'd log + junit land in artifacts/ and upload with if: always().
      # Expected — not guaranteed — on cache-hit runs (measured ~1m pre-step
      # prefix leaves ~4m slack under the vitest step's 25m cap; the 45m job
      # cap above covers the cold-prefix case so the upload survives a hung
      # suite (accepted residual, stated in §5).
      # The workflow-level `defaults.run.shell: bash` supplies pipefail, so the
      # step exit status stays vitest's, not tee's. The junit XML is
      # best-effort (end-of-run writer); the tee'd log is the expected artifact.
      - name: Unit tests (vitest)
        working-directory: dsh-cc
        timeout-minutes: 25
        run: |
          mkdir -p artifacts
          pnpm exec vitest run --reporter=default --reporter=junit --outputFile.junit=artifacts/vitest-junit.xml 2>&1 | tee artifacts/vitest.log

      - name: Upload vitest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-artifacts
          path: dsh-cc/artifacts/
          if-no-files-found: ignore

      # Informational during the two-green-weeks prove-out (plan §4): tier
      # failures do not block merges until the rule is tightened post-prove-out.
      - name: Token-efficiency tiers (informational during prove-out)
        working-directory: dsh-cc
        continue-on-error: true
        run: pnpm check:token-efficiency

      - name: check:subagent-paste
        working-directory: dsh-cc
        run: pnpm check:subagent-paste
