# =============================================================================
# PreSubmit — dsh-cc
#
# GitHub 移植自 orchestrix 的 codebase presubmit。与参考仓的三处有意偏离:
#   1. 单 job:本仓 typecheck≡build(同为 tsc -b tsconfig.packages.json),
#      参考仓 quality-gates/test-and-build 双 job 并联在此只会重复构建 harness。
#   2. 参考仓手工装 Node+内部镜像/bnpm → 本 workflow 用 setup-node 原生
#      pnpm 缓存;两仓依赖全部来自公网 npm。
#   3. ~20 个包以 link:../../../../deepseek-harness/... 依赖兄弟仓库
#      → 并排 checkout:两个 path: 使两仓目录互为兄弟,link 上溯 4 级即命中。
#   4. harness 构建产物(各包 lib/,~64MB)按 pin SHA 用 actions/cache
#      restore/save 缓存,命中即跳过 build:lib(占全流水线 ~62%);save 紧跟
#      build 步(success() 门控防半截产物投毒,且后续测试红推 iteration 仍
#      能保有已建缓存)。node_modules 1.4G 不入缓存,install 每跑必做。
#      产物 glob 为固定深度且恰等于 tsdown workspace 声明的 build:lib 输出集,
#      不用 **:@actions/glob 的 ** 跟随符号链接,会在 pnpm symlink 树上组合
#      爆炸(实测 save 19min 未果);harness 包深度/tsdown workspace 变更需同步。
#
# deepseek-harness pin 升级流程:harness master 验证通过后,更新上方 env 的
# DSH_HARNESS_REF 到新 SHA 并连同本仓适配修改一起提交。改 ref 即换 cache key,
# PR 与合入 main 各冷构建一次(缓存按分支隔离),此后全部命中;旧 entry 闲置
# 7 天自动淘汰。注意这是组织内固定 fork:删除/转私有/force-push GC 都会让 CI 失效。
# =============================================================================
name: PreSubmit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  # deepseek-harness pin:checkout ref 与 harness 产物 cache key 的单一事实源
  DSH_HARNESS_REF: e379fa8bddd68c52b2fad715b70a9a86f92eaf94 # 0.1.3-alpha.2 release merge

permissions:
  contents: read

# 同一 PR/分支的快速连推只保留最新一轮,避免重复构建 deepseek-harness
concurrency:
  group: presubmit-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  presubmit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: dsh-cc

      - uses: actions/checkout@v4
        with:
          repository: dsh-cc/deepseek-harness
          ref: ${{ env.DSH_HARNESS_REF }}
          path: deepseek-harness

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            dsh-cc/pnpm-lock.yaml
            deepseek-harness/pnpm-lock.yaml

      # 纯静态扫描,无需 node_modules:抢在 harness 构建前挡住"测试引用了未声明
      # 的 link:/workspace 依赖"这一类 CI-only 失败(ERR_MODULE_NOT_FOUND)。
      - name: Spec dependency declarations (check:spec-deps)
        working-directory: dsh-cc
        run: node scripts/check-spec-deps.mjs

      - name: Canonical project identity (check:identity)
        working-directory: dsh-cc
        run: node scripts/check-project-identity.mjs

      - name: Publishable manifest invariants (check:publish)
        working-directory: dsh-cc
        run: node scripts/check-publish-manifests.mjs

      # 棘轮模式:基线冻结存量超限文件(只准减不准增),基线清空后即 ≤500 硬门。
      - name: File size budget (check:size)
        working-directory: dsh-cc
        run: node scripts/check-file-size.mjs

      # 另两道纯静态门禁:vendored pi-tui 纯净性(白名单外的 bare import)+
      # TUI harness 边界(@deepseek-ai/* 只准出现在 harness/ 与插件面)。趁
      # 静态阶段拦截,别等 vendor 树污染扩散到消费方才暴露。
      - name: TUI boundary (check:tui-boundary)
        working-directory: dsh-cc
        run: node scripts/check-tui-boundary.mjs

      # 跨包深链 src/ import 会在 tsc emit 中原样保留,运行时命中 Node 的
      # node_modules type-stripping 限制(plugin tree boot 直接失败)。
      - name: Deep src imports (check:deep-imports)
        working-directory: dsh-cc
        run: node scripts/check-deep-src-imports.mjs

      - name: Vendored pi-tui purity (check:vendor-purity)
        working-directory: dsh-cc
        run: node scripts/check-vendor-purity.mjs

      - name: Cache harness build outputs (restore)
        id: cache-harness
        uses: actions/cache/restore@v4
        with:
          path: |
            deepseek-harness/packages/*/*/lib
            deepseek-harness/vendor/*/lib
            deepseek-harness/apps/cli/lib
          key: harness-lib-${{ env.DSH_HARNESS_REF }}

      - name: Install deepseek-harness deps
        working-directory: deepseek-harness
        run: pnpm install --frozen-lockfile

      - name: 'Build deepseek-harness lib (link: 的消费点;跳过 build:web)'
        if: steps.cache-harness.outputs.cache-hit != 'true'
        working-directory: deepseek-harness
        run: pnpm run build:lib

      - name: Cache harness build outputs (save)
        if: steps.cache-harness.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            deepseek-harness/packages/*/*/lib
            deepseek-harness/vendor/*/lib
            deepseek-harness/apps/cli/lib
          key: harness-lib-${{ env.DSH_HARNESS_REF }}

      - name: Install dsh-cc deps
        working-directory: dsh-cc
        env:
          HUSKY: 0
        run: pnpm install --frozen-lockfile

      # Capability 门禁(I1–I11、evidence anchor、registry integrity、生成物
      # 无漂移)依赖 js-yaml,无法进入上方"纯静态、无需 node_modules"车道;
      # install 后立即运行,仍先于 typecheck/test 提供快速反馈。
      - name: Capability evidence (check:capabilities)
        working-directory: dsh-cc
        run: node scripts/check-capability-evidence.mjs

      - name: Parity matrix freshness (check:parity)
        working-directory: dsh-cc
        run: node scripts/generate-parity-matrix.mjs --check

      # 两个 checker 的配对自测(见 docs/plans/2026-09-03-claude-code-capability-manifest.md §5.3)。
      - name: Capability evidence self-test
        working-directory: dsh-cc
        run: node scripts/check-capability-evidence.test.mjs

      - name: Parity matrix generator self-test
        working-directory: dsh-cc
        run: node scripts/generate-parity-matrix.test.mjs

      - name: Typecheck ≡ Build (tsc -b project references)
        working-directory: dsh-cc
        run: pnpm typecheck

      # lib/ is gitignored; the browser client bundle (module-table-handoff
      # factory) only exists after tsdown runs. check:exports needs it on disk,
      # and a follow-up profile sync rsyncs whatever is on disk — regenerate it
      # right after tsc so both stay green.
      - name: Bundle client (tsdown → lib/client.js)
        working-directory: dsh-cc
        run: pnpm run bundle:client

      # 与 publish.yml 平齐:每个 exports 指向的 lib/* 必须由本次构建真实产出。
      # 此前只在 publish 阶段跑,#112 的 tsconfig 引用缺失(serena-first 从不
      # 产出 lib/)得以合入——exports 幽灵目标必须合入前就挡下。
      - name: Export targets (check:exports)
        working-directory: dsh-cc
        run: pnpm check:exports

      - name: Unit tests (vitest)
        working-directory: dsh-cc
        run: pnpm test

      - name: check:subagent-paste
        working-directory: dsh-cc
        run: pnpm check:subagent-paste
