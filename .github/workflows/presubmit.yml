# =============================================================================
# PreSubmit — dsh-cc
#
# GitHub port of orchestrix's codebase presubmit. Four intentional deviations
# from the reference repo:
#   1. Single job: here typecheck≡build (both are `tsc -b
#      tsconfig.packages.json`); the reference repo's parallel
#      quality-gates / test-and-build jobs would only build the harness twice.
#   2. The reference repo installs Node + an internal mirror/bnpm by hand;
#      this workflow uses setup-node's native pnpm cache instead — both
#      repos' dependencies come entirely from the public npm registry.
#   3. ~20 packages depend on the sibling repo via
#      link:../../../../deepseek-harness/... → side-by-side checkouts: the two
#      `path:` values make the repos siblings, so the link: walk-up of 4
#      levels lands exactly.
#   4. Harness build outputs (each package's lib/, ~64MB) are cached by pin
#      SHA via actions/cache restore/save; a hit skips build:lib (~62% of the
#      pipeline). save follows the build step directly (success() gating
#      keeps half-built artifacts from poisoning the cache, and a
#      red-test iteration still keeps the already-built cache). node_modules
#      (1.4G) is never cached — install runs on every run. The artifact glob
#      is fixed-depth and exactly matches the build:lib output set declared
#      by the tsdown workspace — no `**`: @actions/glob's `**` follows
#      symlinks and explodes combinatorially on the pnpm symlink tree (a save
#      measured 19min without finishing). Harness package depth / tsdown
#      workspace changes must be mirrored here.
#
# deepseek-harness pin upgrade flow: once harness master checks out, update
# DSH_HARNESS_REF in the env block above to the new SHA and commit it
# together with this repo's adaptations. Changing the ref changes the cache
# key — one cold build each for the PR and the merge to main (caches are
# branch-scoped), hits from then on; the idle old entry expires after 7
# days. Note this is a fixed org-internal fork: deletion, going private, or
# force-push GC all break CI.
# =============================================================================
name: PreSubmit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  # deepseek-harness pin: single source of truth for the checkout ref and
  # the harness-artifact cache key
  DSH_HARNESS_REF: 1ef9c1fa9afbea78c5537bfc8b6d1c27d598798e # 0.1.5-rc.1 release commit

permissions:
  contents: read

# On rapid consecutive pushes to the same PR/branch keep only the newest
# run — avoids building deepseek-harness twice
concurrency:
  group: presubmit-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  presubmit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: dsh-cc

      - uses: actions/checkout@v4
        with:
          repository: dsh-cc/deepseek-harness
          ref: ${{ env.DSH_HARNESS_REF }}
          path: deepseek-harness

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            dsh-cc/pnpm-lock.yaml
            deepseek-harness/pnpm-lock.yaml

      # Pure static scan, no node_modules needed: catches "a spec imports an
      # undeclared link:/workspace dependency" — a CI-only failure class
      # (ERR_MODULE_NOT_FOUND) — before the harness build starts.
      - name: Spec dependency declarations (check:spec-deps)
        working-directory: dsh-cc
        run: node scripts/check-spec-deps.mjs

      - name: Canonical project identity (check:identity)
        working-directory: dsh-cc
        run: node scripts/check-project-identity.mjs

      - name: Publishable manifest invariants (check:publish)
        working-directory: dsh-cc
        run: node scripts/check-publish-manifests.mjs

      # Bilingual README trio gate (README.md/README.zh.md/README.i18n.yaml
      # pairing record — see docs/i18n/README.md); pure static: git
      # hash-object needs no node_modules.
      - name: Package README trio (check:readme)
        working-directory: dsh-cc
        run: node scripts/check-readme.mjs

      - name: Package README trio self-test
        working-directory: dsh-cc
        run: node scripts/check-readme.test.mjs

      # Ratchet mode: the baseline freezes existing over-budget files
      # (shrink-only); once the baseline is empty the gate becomes a hard
      # ≤500-line cap.
      - name: File size budget (check:size)
        working-directory: dsh-cc
        run: node scripts/check-file-size.mjs

      # Two more pure-static gates: vendored pi-tui purity (no bare imports
      # outside the whitelist) + the TUI harness boundary (@deepseek-ai/* may
      # appear only in harness/ and the plugin surface). Catch violations in
      # the static phase — don't wait for vendor-tree pollution to surface at
      # the consumers.
      - name: TUI boundary (check:tui-boundary)
        working-directory: dsh-cc
        run: node scripts/check-tui-boundary.mjs

      # Cross-package deep src/ imports survive verbatim in tsc emit and hit
      # Node's node_modules type-stripping restriction at runtime (plugin
      # tree boot fails outright).
      - name: Deep src imports (check:deep-imports)
        working-directory: dsh-cc
        run: node scripts/check-deep-src-imports.mjs

      - name: Vendored pi-tui purity (check:vendor-purity)
        working-directory: dsh-cc
        run: node scripts/check-vendor-purity.mjs

      - name: Cache harness build outputs (restore)
        id: cache-harness
        uses: actions/cache/restore@v4
        with:
          path: |
            deepseek-harness/packages/*/*/lib
            deepseek-harness/vendor/*/lib
            deepseek-harness/apps/cli/lib
          key: harness-lib-${{ env.DSH_HARNESS_REF }}

      - name: Install deepseek-harness deps
        working-directory: deepseek-harness
        run: pnpm install --frozen-lockfile

      - name: 'Build deepseek-harness lib (consumption point of link:; build:web skipped)'
        if: steps.cache-harness.outputs.cache-hit != 'true'
        working-directory: deepseek-harness
        run: pnpm run build:lib

      - name: Cache harness build outputs (save)
        if: steps.cache-harness.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            deepseek-harness/packages/*/*/lib
            deepseek-harness/vendor/*/lib
            deepseek-harness/apps/cli/lib
          key: harness-lib-${{ env.DSH_HARNESS_REF }}

      - name: Install dsh-cc deps
        working-directory: dsh-cc
        env:
          HUSKY: 0
        run: pnpm install --frozen-lockfile

      # The capability gates (I1–I11, evidence anchors, registry integrity,
      # no generated-artifact drift) depend on js-yaml, so they cannot join
      # the pure-static no-node_modules lane above; they run right after
      # install, still ahead of typecheck/test for fast feedback.
      - name: Capability evidence (check:capabilities)
        working-directory: dsh-cc
        run: node scripts/check-capability-evidence.mjs

      - name: Parity matrix freshness (check:parity)
        working-directory: dsh-cc
        run: node scripts/generate-parity-matrix.mjs --check

      # Paired self-tests for the two checkers (see
      # docs/plans/2026-09-03-claude-code-capability-manifest.md §5.3).
      - name: Capability evidence self-test
        working-directory: dsh-cc
        run: node scripts/check-capability-evidence.test.mjs

      - name: Parity matrix generator self-test
        working-directory: dsh-cc
        run: node scripts/generate-parity-matrix.test.mjs

      - name: Typecheck ≡ Build (tsc -b project references)
        working-directory: dsh-cc
        run: pnpm typecheck

      # lib/ is gitignored; the browser client bundle (module-table-handoff
      # factory) only exists after tsdown runs. check:exports needs it on disk,
      # and a follow-up profile sync rsyncs whatever is on disk — regenerate it
      # right after tsc so both stay green.
      - name: Bundle client (tsdown → lib/client.js)
        working-directory: dsh-cc
        run: pnpm run bundle:client

      # Level with publish.yml: every lib/* an exports entry points at must
      # be produced by this very build. This used to run only at publish
      # time — #112's missing tsconfig reference (serena-first never emits
      # lib/) got merged that way; ghost exports targets must be blocked
      # pre-merge.
      - name: Export targets (check:exports)
        working-directory: dsh-cc
        run: pnpm check:exports

      - name: Unit tests (vitest)
        working-directory: dsh-cc
        run: pnpm test

      - name: check:subagent-paste
        working-directory: dsh-cc
        run: pnpm check:subagent-paste
