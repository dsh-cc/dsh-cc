name: Formal design

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Must equal presubmit.yml (design record §16.3 item 2): the sibling
  # checkout exists only to satisfy the link: workspace deps, so a stale pin
  # here silently tests against a different harness line and forks the pnpm
  # store cache key. publish.yml derives its pin from presubmit.yml; this
  # workflow is the one place the value is duplicated by hand.
  DSH_HARNESS_REF: 2f97f60455605e915b8176d9170cae337bfedcc6 # 0.2.2-rc.1 release commit (keep equal to presubmit.yml)

defaults:
  run:
    shell: bash

concurrency:
  group: formal-design-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # The `+` only lives in the display name: job ids accept letters, digits,
  # `-` and `_`, so the id is `formal-design-tla` while the check reads
  # `formal-design-tla+`, pairing with `formal-design-lean`.
  formal-design-tla:
    name: formal-design-tla+
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: dsh-cc
      - uses: actions/checkout@v4
        with:
          repository: dsh-cc/deepseek-harness
          ref: ${{ env.DSH_HARNESS_REF }}
          path: deepseek-harness
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          # Primary line, same file as presubmit (deviation #5 there).
          node-version-file: dsh-cc/.nvmrc
      # Pnpm store cache, keyed on the lockfiles with a prefix fallback so a
      # dependency change only downloads the new tarballs (setup-node's
      # `cache: pnpm` restores on the exact key only — see presubmit.yml
      # deviation #2). Restore-only in BOTH jobs here: presubmit.yml's
      # `quality-gates` is the single writer repo-wide, because this workflow
      # triggers nowhere presubmit does not and its store (dsh-cc deps only,
      # no sibling-harness deps) is a strict subset — letting it write would
      # hand presubmit a partially-populated entry and slow its install down
      # (observed: 13s warm → 26s after a lean entry won the key in run 1).
      - name: Resolve the pnpm store directory
        id: pnpm-store
        run: |
          dir=$(pnpm store path --silent)
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "layout=$(basename "$dir")" >> "$GITHUB_OUTPUT"
      - name: Restore the pnpm store
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-store-${{ runner.os }}-${{ steps.pnpm-store.outputs.layout }}-${{ hashFiles('dsh-cc/pnpm-lock.yaml', 'deepseek-harness/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-${{ steps.pnpm-store.outputs.layout }}-
      - name: Install workspace dependencies (no harness build required)
        working-directory: dsh-cc
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify the bundled pinned TLC JAR (no download)
        working-directory: dsh-cc
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const skill = 'packages/plugin/dsh-cc-agents/skills/formal-design';
          const pin = JSON.parse(fs.readFileSync(skill + '/scripts/toolchain.json', 'utf8'));
          const actual = createHash('sha1').update(fs.readFileSync(skill + '/toolchain/tla2tools.jar')).digest('hex');
          if (actual !== pin.sha1) throw new Error('Bundled TLC is missing or has the wrong checksum');
          JS
      # Preflight every committed model, but do NOT run TLC. This closes the
      # visibility gap that let a committed model rot unread (the Lean job
      # enumerates specs/lean; nothing ever enumerated specs/tla). It is safe to
      # sweep unconditionally because preflight asserts only structural facts -
      # schema, paths, pinned JAR, generated cfg bytes - and makes no verdict:
      # a model whose probes are designed to be red still passes here.
      # A full TLC sweep is a different decision (cost, and "green" would start
      # standing in for "design verified"); this step must not become that.
      - name: Preflight every committed TLA model (structure only, no TLC)
        working-directory: dsh-cc
        run: |
          unset TLA2TOOLS_JAR
          node --input-type=module - <<'JS'
          import { readdirSync, statSync } from 'node:fs';
          import { join } from 'node:path';
          import { spawnSync } from 'node:child_process';

          const root = process.cwd();
          const scripts = 'packages/plugin/dsh-cc-agents/skills/formal-design/scripts';
          // Code-point path order: UTF-8 byte comparison, matching the Lean job.
          const byteOrder = (a, b) => Buffer.compare(Buffer.from(a), Buffer.from(b));
          const regularFile = path => { try { return statSync(path).isFile(); } catch { return false; } };

          function run(args) {
            const result = spawnSync('node', args, { cwd: root, stdio: 'inherit' });
            if (result.error) throw result.error;
            if (result.status !== 0) throw new Error(`node ${args.join(' ')} exited ${result.status}`);
          }

          const base = join(root, 'specs/tla');
          const modelIds = readdirSync(base, { withFileTypes: true })
            .filter(entry => entry.isDirectory())
            .map(entry => entry.name)
            .sort(byteOrder);
          if (modelIds.length === 0) throw new Error('no committed TLA models were discovered under specs/tla');
          for (const id of modelIds) {
            const model = `specs/tla/${id}`;
            if (!regularFile(join(root, model, 'checks.json'))) {
              throw new Error(`discovered TLA model directory ${model} has no regular checks.json`);
            }
            console.log(`preflighting committed TLA model ${model}`);
            run([`${scripts}/preflight.mjs`, '--project', root, '--model', model]);
          }
          console.log(`preflight passed for all ${modelIds.length} committed TLA models`);
          JS
      - name: Contract, packaged default and real TLC integration tests
        working-directory: dsh-cc
        env:
          FORMAL_DESIGN_CI: '1'
          FORMAL_DESIGN_ARTIFACTS: ${{ runner.temp }}/formal-design-tla-artifacts
        run: |
          unset TLA2TOOLS_JAR
          pnpm exec vitest run packages/plugin/dsh-cc-agents/tests/formal-design.spec.ts packages/plugin/dsh-cc-agents/tests/formal-design-integration.spec.ts packages/plugin/dsh-cc-agents/tests/package-shape.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: formal-design-tla-diagnostics
          path: ${{ runner.temp }}/formal-design-tla-artifacts
          include-hidden-files: true
          if-no-files-found: warn

  formal-design-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: dsh-cc
      - uses: actions/checkout@v4
        with:
          repository: dsh-cc/deepseek-harness
          ref: ${{ env.DSH_HARNESS_REF }}
          path: deepseek-harness
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          # Primary line, same file as presubmit (deviation #5 there).
          node-version-file: dsh-cc/.nvmrc
      # Restore-only like the TLA+ job — presubmit.yml's `quality-gates` owns
      # the write (see the note in the TLA+ job).
      - name: Resolve the pnpm store directory
        id: pnpm-store
        run: |
          dir=$(pnpm store path --silent)
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "layout=$(basename "$dir")" >> "$GITHUB_OUTPUT"
      - name: Restore the pnpm store
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-store-${{ runner.os }}-${{ steps.pnpm-store.outputs.layout }}-${{ hashFiles('dsh-cc/pnpm-lock.yaml', 'deepseek-harness/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-${{ steps.pnpm-store.outputs.layout }}-
      - name: Install workspace dependencies (no harness build required)
        working-directory: dsh-cc
        run: pnpm install --frozen-lockfile
      # The input-admission-arithmetic conformance adapter imports the real
      # @dsh-cc/input-budget core, whose bare `@dsh-cc/input-ledger` import
      # resolves to that package's built lib/. Project references build both
      # without the full client bundle.
      - name: Build conformance-adapter dependencies (input-budget chain)
        working-directory: dsh-cc
        run: pnpm exec tsc -b packages/context/input-budget --force
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The toolchain is ~200 MB per run. Cache it under a key derived from the
      # pin file (scripts/lean-toolchain.json), so a pin bump misses and
      # re-provisions instead of silently reusing the wrong Lean. The receipt is
      # cached next to the root: lean-provision writes <root>.receipt.json and
      # lean-preflight demands it, so a root without its receipt is unusable.
      # Unlike the pnpm store (single writer: presubmit's quality-gates), this
      # job is the only consumer of this cache, so it is also its writer.
      # There is deliberately NO restore-keys fallback: a pin bump must miss and
      # re-download, never reuse a different Lean under a new pin.
      - name: Restore the pinned Lean toolchain
        id: lean-toolchain
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/lean-4.35.0
            ${{ runner.temp }}/lean-4.35.0.receipt.json
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('dsh-cc/packages/plugin/dsh-cc-agents/skills/formal-design/scripts/lean-toolchain.json') }}
      - name: Provision the pinned Lean toolchain (checksum-validated)
        id: lean-provision
        working-directory: dsh-cc
        run: |
          root="$RUNNER_TEMP/lean-4.35.0"
          # A restored toolchain is only trusted when its receipt is present and
          # the interpreter is executable; lean-preflight re-validates both the
          # receipt's archive hash and the recomputed content digest, so a
          # corrupt or partial restore still fails closed there.
          if [ -f "$root.receipt.json" ] && [ -x "$root/bin/lean" ]; then
            echo "reusing the cached toolchain at $root"
            echo "provisioned=skipped" >> "$GITHUB_OUTPUT"
          else
            echo "cache miss: provisioning the pinned toolchain"
            rm -rf "$root" "$root.receipt.json"
            node packages/plugin/dsh-cc-agents/skills/formal-design/scripts/lean-provision.mjs \
              --dest "$root" --platform linux-x64
            echo "provisioned=done" >> "$GITHUB_OUTPUT"
          fi
          echo "FORMAL_DESIGN_LEAN_ROOT=$root" >> "$GITHUB_ENV"
      # Save only on a miss and only after provisioning succeeded, so a failed
      # download never publishes a broken entry other runs would restore.
      - name: Save the pinned Lean toolchain
        if: steps.lean-provision.outputs.provisioned == 'done'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/lean-4.35.0
            ${{ runner.temp }}/lean-4.35.0.receipt.json
          key: ${{ steps.lean-toolchain.outputs.cache-primary-key }}
      - name: Contract, packaged default and real Lean integration tests
        working-directory: dsh-cc
        env:
          FORMAL_DESIGN_CI: '1'
          FORMAL_DESIGN_LEAN_CI: '1'
          FORMAL_DESIGN_ARTIFACTS: ${{ runner.temp }}/formal-design-lean-artifacts
        run: |
          unset TLA2TOOLS_JAR
          pnpm exec vitest run \
            packages/plugin/dsh-cc-agents/tests/formal-design-lean.spec.ts \
            packages/plugin/dsh-cc-agents/tests/formal-design-lean-manifest.spec.ts \
            packages/plugin/dsh-cc-agents/tests/formal-design-lean-check.spec.ts \
            packages/plugin/dsh-cc-agents/tests/formal-design-lean-conformance-contract.spec.ts \
            packages/plugin/dsh-cc-agents/tests/formal-design-bridge.spec.ts \
            packages/plugin/dsh-cc-agents/tests/formal-design-lean-integration.spec.ts \
            packages/plugin/dsh-cc-agents/tests/formal-design-lean-conformance.spec.ts \
            packages/plugin/dsh-cc-agents/tests/package-shape.spec.ts
      - name: Validate committed Lean models and bridges
        working-directory: dsh-cc
        env:
          FORMAL_DESIGN_ARTIFACTS: ${{ runner.temp }}/formal-design-lean-artifacts
        run: |
          node --input-type=module - <<'JS'
          import { existsSync, mkdirSync, readdirSync, readFileSync, statSync } from 'node:fs';
          import { join } from 'node:path';
          import { spawnSync } from 'node:child_process';

          const root = process.cwd();
          const scripts = 'packages/plugin/dsh-cc-agents/skills/formal-design/scripts';
          const leanRoot = process.env.FORMAL_DESIGN_LEAN_ROOT;
          if (!leanRoot) throw new Error('FORMAL_DESIGN_LEAN_ROOT is required for Lean verification');
          mkdirSync(process.env.FORMAL_DESIGN_ARTIFACTS, { recursive: true });
          // Code-point path order: UTF-8 byte comparison.
          const byteOrder = (a, b) => Buffer.compare(Buffer.from(a), Buffer.from(b));

          function run(args) {
            const result = spawnSync('node', args, { cwd: root, stdio: 'inherit' });
            if (result.error) throw result.error;
            if (result.status !== 0) throw new Error(`node ${args.join(' ')} exited ${result.status}`);
          }
          const regularFile = path => { try { return statSync(path).isFile(); } catch { return false; } };

          const modelsDir = join(root, 'specs/lean');
          const modelIds = readdirSync(modelsDir, { withFileTypes: true })
            .filter(entry => entry.isDirectory())
            .map(entry => entry.name)
            .sort(byteOrder);
          for (const id of modelIds) {
            const model = `specs/lean/${id}`;
            if (!regularFile(join(root, model, 'checks.json'))) {
              throw new Error(`discovered Lean model directory ${model} has no regular checks.json`);
            }
            console.log(`validating committed Lean model ${model}`);
            run([`${scripts}/lean-preflight.mjs`, '--project', root, '--model', model, '--lean-root', leanRoot]);
            run([`${scripts}/lean-check.mjs`, '--project', root, '--model', model, '--lean-root', leanRoot]);
            run([`${scripts}/lean-check-conformance.mjs`, '--project', root, '--model', model, '--lean-root', leanRoot]);
            run([`${scripts}/lean-check-evidence.mjs`, '--project', root, '--model', model, '--stage', 'acceptance']);
          }

          const bridgeRoot = join(root, 'specs/formal');
          const bridges = existsSync(bridgeRoot)
            ? readdirSync(bridgeRoot, { withFileTypes: true })
              .filter(entry => entry.isDirectory())
              .map(entry => entry.name)
              .sort(byteOrder)
            : [];
          if (bridges.length === 0) {
            console.log('no committed specs/formal/*/bridge.json combined models; skipping the bridge flow');
          }
          for (const id of bridges) {
            const bridge = `specs/formal/${id}/bridge.json`;
            if (!regularFile(join(root, bridge))) {
              throw new Error(`discovered combined model directory specs/formal/${id} has no regular bridge.json`);
            }
            const contract = JSON.parse(readFileSync(join(root, bridge), 'utf8'));
            console.log(`validating combined model ${bridge}`);
            run([`${scripts}/check.mjs`, '--project', root, '--model', contract.tlaModel, '--bridge', bridge]);
            run([`${scripts}/lean-check.mjs`, '--project', root, '--model', contract.leanModel, '--lean-root', leanRoot, '--bridge', bridge]);
            run([`${scripts}/lean-check-conformance.mjs`, '--project', root, '--model', contract.leanModel, '--lean-root', leanRoot, '--bridge', bridge]);
            run([`${scripts}/check-combined-evidence.mjs`, '--project', root, '--bridge', bridge]);
          }
          JS
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: formal-design-lean-diagnostics
          path: |
            ${{ runner.temp }}/formal-design-lean-artifacts
            dsh-cc/.formal-design
          include-hidden-files: true
          if-no-files-found: warn
