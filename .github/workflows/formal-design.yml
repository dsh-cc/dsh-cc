name: Formal design

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Keep equal to presubmit.yml; linked workspace dependencies need siblings.
  DSH_HARNESS_REF: c1b47e41fcd54d20a0f061df28683bfc29ee24e5

defaults:
  run:
    shell: bash

concurrency:
  group: formal-design-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  formal-design:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: dsh-cc
      - uses: actions/checkout@v4
        with:
          repository: dsh-cc/deepseek-harness
          ref: ${{ env.DSH_HARNESS_REF }}
          path: deepseek-harness
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            dsh-cc/pnpm-lock.yaml
            deepseek-harness/pnpm-lock.yaml
      - name: Install workspace dependencies (no harness build required)
        working-directory: dsh-cc
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download and verify the exact pinned TLC JAR
        working-directory: dsh-cc
        run: |
          pin=packages/plugin/dsh-cc-agents/skills/formal-design/scripts/toolchain.json
          jar_url=$(node --input-type=module -e 'import fs from "node:fs"; process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1], "utf8")).downloadUrl)' "$pin")
          jar_path="$RUNNER_TEMP/tla2tools.jar"
          curl --fail --location --retry 3 --output "$jar_path" "$jar_url"
          node --input-type=module - "$pin" "$jar_path" <<'JS'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const pin = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const actual = createHash('sha1').update(fs.readFileSync(process.argv[3])).digest('hex');
          if (actual !== pin.sha1) throw new Error('Pinned TLC checksum mismatch');
          JS
          test -s "$jar_path"
          printf 'TLA2TOOLS_JAR=%s\n' "$jar_path" >> "$GITHUB_ENV"
      - name: Contract and real TLC integration tests (missing JAR must fail)
        working-directory: dsh-cc
        env:
          FORMAL_DESIGN_CI: '1'
          FORMAL_DESIGN_ARTIFACTS: ${{ runner.temp }}/formal-design-artifacts
        run: |
          test -s "$TLA2TOOLS_JAR"
          pnpm exec vitest run packages/plugin/dsh-cc-agents/tests/formal-design.spec.ts packages/plugin/dsh-cc-agents/tests/formal-design-integration.spec.ts packages/plugin/dsh-cc-agents/tests/package-shape.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: formal-design-diagnostics
          path: ${{ runner.temp }}/formal-design-artifacts
          include-hidden-files: true
          if-no-files-found: warn
