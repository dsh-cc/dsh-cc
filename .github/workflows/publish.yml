# =============================================================================
# Publish (npm) — dsh-cc
#
# v* tag 推送触发:执行与 presubmit 等价的完整检查链(另加发布专属门禁),
# 再把全部非 private 包发布到 npmjs。presubmit 不监听 tag,故本 workflow
# 自带全量门禁。
#
# 版本模型(lockstep):scripts/release.mjs 在本地统一改写所有可发布包的
# 版本、提交并打 tag;本 workflow 校验 tag 与清单一致后才发布。重跑幂等:
# pnpm -r publish 自动跳过 registry 上已存在的版本(断点续发),--tag 会对
# 已发布版本重挂 dist-tag。
#
# 认证两阶段:bootstrap 期在仓库 secret 配置 NPM_TOKEN(granular)走 token;
# 升级为 npm Trusted Publishing(OIDC)时在 npmjs 为每个包配置 trusted
# publisher(org=dsh-cc, repo=dsh-cc, workflow=publish.yml,
# environment=npm-publish),然后删除 NPM_TOKEN secret —— 本文件无需改动。
# =============================================================================
name: Publish (npm)

run-name: Publish ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的 v* tag(用于失败重跑)'
        required: true

permissions:
  contents: write   # gh release create
  id-token: write   # --provenance / OIDC trusted publishing

concurrency:
  group: release
  cancel-in-progress: false   # 发布可重跑、不可打断

env:
  # push(ref_name 即 tag)与 dispatch(inputs.tag)两条路径统一出 TAG
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
        with:
          path: dsh-cc
          ref: ${{ env.TAG }}
          fetch-depth: 0   # merge-base 祖先门禁需要全历史

      # 廉价门禁放最前:失败时不必等装依赖/构建 harness
      - name: Tag gates (ancestor of main; versions match tag)
        working-directory: dsh-cc
        run: |
          git fetch origin main --quiet
          git merge-base --is-ancestor "${TAG}^{commit}" origin/main || { echo "::error::tag $TAG 不在 origin/main 上 —— 先把 main 推上去:git push origin main $TAG(或仅对已推送的 main 提交重新打 tag)"; exit 1; }
          node scripts/check-release-version.mjs "$TAG"

      # 与 presubmit.yml 单一事实源:锚定 env 块里唯一的 SHA 行,0 个或 2+ 个匹配即失败
      - name: Derive DSH_HARNESS_REF from presubmit.yml
        working-directory: dsh-cc
        run: |
          hits=$(grep -cE '^\s*DSH_HARNESS_REF:\s*[0-9a-f]{40}' .github/workflows/presubmit.yml)
          [ "$hits" = "1" ] || { echo "::error::presubmit.yml 中 DSH_HARNESS_REF 不唯一($hits 处)"; exit 1; }
          ref=$(grep -oE '^\s*DSH_HARNESS_REF:\s*[0-9a-f]{40}' .github/workflows/presubmit.yml | grep -oE '[0-9a-f]{40}')
          echo "DSH_HARNESS_REF=$ref" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          repository: dsh-cc/deepseek-harness
          ref: ${{ env.DSH_HARNESS_REF }}
          path: deepseek-harness

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22   # 特意不配 registry-url:token/OIDC 在发布步显式区分
          cache: pnpm
          cache-dependency-path: |
            dsh-cc/pnpm-lock.yaml
            deepseek-harness/pnpm-lock.yaml

      - name: Spec dependency declarations (check:spec-deps)
        working-directory: dsh-cc
        run: node scripts/check-spec-deps.mjs

      - name: Canonical project identity (check:identity)
        working-directory: dsh-cc
        run: node scripts/check-project-identity.mjs

      - name: Publishable manifest invariants (check:publish)
        working-directory: dsh-cc
        run: node scripts/check-publish-manifests.mjs

      # 与 presubmit 保持一致:发布前同样把住双语 README 三件套配对门禁
      - name: Package README trio (check:readme)
        working-directory: dsh-cc
        run: node scripts/check-readme.mjs

      # 与 presubmit 保持一致:纯静态扫描,挡 vendor 污染与 harness 边界突破
      - name: TUI boundary (check:tui-boundary)
        working-directory: dsh-cc
        run: node scripts/check-tui-boundary.mjs

      - name: Vendored pi-tui purity (check:vendor-purity)
        working-directory: dsh-cc
        run: node scripts/check-vendor-purity.mjs

      # harness lib 缓存只 restore 不 save:缓存在 presubmit 侧生产,发布只消费
      - name: Cache harness build outputs (restore only)
        id: cache-harness
        uses: actions/cache/restore@v4
        with:
          path: |
            deepseek-harness/packages/*/*/lib
            deepseek-harness/vendor/*/lib
            deepseek-harness/apps/cli/lib
          key: harness-lib-${{ env.DSH_HARNESS_REF }}

      - name: Install deepseek-harness deps
        working-directory: deepseek-harness
        run: pnpm install --frozen-lockfile

      - name: 'Build deepseek-harness lib (cache miss only)'
        if: steps.cache-harness.outputs.cache-hit != 'true'
        working-directory: deepseek-harness
        run: pnpm run build:lib

      - name: Install dsh-cc deps
        working-directory: dsh-cc
        env:
          HUSKY: 0
        run: pnpm install --frozen-lockfile

      - name: Typecheck ≡ Build (tsc -b project references)
        working-directory: dsh-cc
        run: pnpm typecheck

      - name: Bundle client (tsdown → lib/client.js)
        working-directory: dsh-cc
        run: pnpm run bundle:client

      - name: Export targets (check:exports)
        working-directory: dsh-cc
        run: pnpm check:exports

      - name: Unit tests (vitest)
        working-directory: dsh-cc
        run: pnpm test

      - name: check:subagent-paste
        working-directory: dsh-cc
        run: pnpm check:subagent-paste

      - name: Resolve dist-tag (prerelease → next; stable → latest)
        run: |
          case "${TAG#v}" in
            *-*) echo "DIST_TAG=next" >> "$GITHUB_ENV" ;;
            *)   echo "DIST_TAG=latest" >> "$GITHUB_ENV" ;;
          esac

      # 二选一认证:NPM_TOKEN 存在 → token(bootstrap);不存在 → 不配置任何
      # 静态凭据,pnpm 11.7 自动走 OIDC trusted publishing
      - name: Registry auth (token bootstrap | OIDC flip)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
            echo "auth mode: NPM_TOKEN (bootstrap)"
          else
            echo "auth mode: OIDC trusted publishing (no static token configured)"
          fi

      # --no-git-checks: we checkout a tag (detached HEAD). pnpm 11.7 still
      # enforces publish-branch=master|main under -r, so the default git
      # checks fail with ERR_PNPM_GIT_UNKNOWN_BRANCH. Ancestry + version
      # gates above already cover "is this the intended commit".
      # Sequential + 8s gap: npm rate-limits first publishes on a new
      # scope (~20–30 PUTs / few minutes). pnpm -r fires them back-to-back
      # and dies mid-set with E429. The script skips versions already on
      # the registry, so reruns only attempt the remainder.
      - name: Publish all packages (skips versions already on the registry)
        working-directory: dsh-cc
        env:
          PUBLISH_DELAY_MS: 8000
        run: node scripts/publish-packages.mjs --tag "$DIST_TAG" --provenance --no-git-checks

      - name: GitHub Release
        working-directory: dsh-cc
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          extra=(); [ "$DIST_TAG" = "next" ] && extra+=(--prerelease)
          gh release create "$TAG" "${extra[@]}" --generate-notes --verify-tag
