# =============================================================================
# Publish (npm) — dsh-cc
#
# Triggered by pushing a v* tag: runs the full presubmit-equivalent check
# chain (plus release-only gates), then publishes every non-private package
# to npmjs. presubmit doesn't listen to tags, so this workflow carries the
# complete gate set itself.
#
# Version model (lockstep): scripts/release.mjs locally rewrites every
# publishable package's version, commits, and tags; this workflow verifies
# tag/manifest consistency before publishing. Reruns are idempotent:
# `pnpm -r publish` skips versions already on the registry (resume after a
# partial publish), and --tag reattaches the dist-tag for versions already
# published.
#
# Two-phase auth: during bootstrap a repo secret NPM_TOKEN (granular)
# authenticates via token; when upgrading to npm Trusted Publishing (OIDC),
# configure a trusted publisher for each package on npmjs (org=dsh-cc,
# repo=dsh-cc, workflow=publish.yml, environment=npm-publish), then delete
# the NPM_TOKEN secret — this file needs no change.
# =============================================================================
name: Publish (npm)

run-name: Publish ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v* tag (for rerunning a failed publish)'
        required: true

permissions:
  contents: write   # gh release create
  id-token: write   # --provenance / OIDC trusted publishing

concurrency:
  group: release
  cancel-in-progress: false   # releases are rerunnable, never interruptible

env:
  # Unify TAG across the push path (ref_name = tag) and the dispatch path
  # (inputs.tag)
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
        with:
          path: dsh-cc
          ref: ${{ env.TAG }}
          fetch-depth: 0   # the merge-base ancestry gate needs full history

      # Cheap gates first: a failure here never waits on dependency
      # installation or the harness build
      - name: Tag gates (ancestor of main; versions match tag)
        working-directory: dsh-cc
        run: |
          git fetch origin main --quiet
          git merge-base --is-ancestor "${TAG}^{commit}" origin/main || { echo "::error::tag $TAG is not on origin/main — push main first: git push origin main $TAG (or re-tag an already-pushed main commit)"; exit 1; }
          node scripts/check-release-version.mjs "$TAG"

      # Single source of truth is presubmit.yml: anchor the one SHA line in
      # its env block; 0 or 2+ matches fails here
      - name: Derive DSH_HARNESS_REF from presubmit.yml
        working-directory: dsh-cc
        run: |
          hits=$(grep -cE '^\s*DSH_HARNESS_REF:\s*[0-9a-f]{40}' .github/workflows/presubmit.yml)
          [ "$hits" = "1" ] || { echo "::error::DSH_HARNESS_REF in presubmit.yml is not unique ($hits matches)"; exit 1; }
          ref=$(grep -oE '^\s*DSH_HARNESS_REF:\s*[0-9a-f]{40}' .github/workflows/presubmit.yml | grep -oE '[0-9a-f]{40}')
          echo "DSH_HARNESS_REF=$ref" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          repository: dsh-cc/deepseek-harness
          ref: ${{ env.DSH_HARNESS_REF }}
          path: deepseek-harness

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22   # deliberately no registry-url: token vs OIDC is decided explicitly in the publish step
          cache: pnpm
          cache-dependency-path: |
            dsh-cc/pnpm-lock.yaml
            deepseek-harness/pnpm-lock.yaml

      - name: Spec dependency declarations (check:spec-deps)
        working-directory: dsh-cc
        run: node scripts/check-spec-deps.mjs

      - name: Canonical project identity (check:identity)
        working-directory: dsh-cc
        run: node scripts/check-project-identity.mjs

      - name: Publishable manifest invariants (check:publish)
        working-directory: dsh-cc
        run: node scripts/check-publish-manifests.mjs

      # Level with presubmit: the bilingual README trio pairing gate holds
      # before a release too
      - name: Package README trio (check:readme)
        working-directory: dsh-cc
        run: node scripts/check-readme.mjs

      # Level with presubmit: pure static scans that block vendor pollution
      # and harness-boundary breaks
      - name: TUI boundary (check:tui-boundary)
        working-directory: dsh-cc
        run: node scripts/check-tui-boundary.mjs

      - name: Vendored pi-tui purity (check:vendor-purity)
        working-directory: dsh-cc
        run: node scripts/check-vendor-purity.mjs

      # The harness lib cache is restored but never saved here: the cache is
      # produced on the presubmit side, release only consumes it
      - name: Cache harness build outputs (restore only)
        id: cache-harness
        uses: actions/cache/restore@v4
        with:
          path: |
            deepseek-harness/packages/*/*/lib
            deepseek-harness/vendor/*/lib
            deepseek-harness/apps/cli/lib
          key: harness-lib-${{ env.DSH_HARNESS_REF }}

      - name: Install deepseek-harness deps
        working-directory: deepseek-harness
        run: pnpm install --frozen-lockfile

      - name: 'Build deepseek-harness lib (cache miss only)'
        if: steps.cache-harness.outputs.cache-hit != 'true'
        working-directory: deepseek-harness
        run: pnpm run build:lib

      - name: Install dsh-cc deps
        working-directory: dsh-cc
        env:
          HUSKY: 0
        run: pnpm install --frozen-lockfile

      - name: Typecheck ≡ Build (tsc -b project references)
        working-directory: dsh-cc
        run: pnpm typecheck

      - name: Bundle client (tsdown → lib/client.js)
        working-directory: dsh-cc
        run: pnpm run bundle:client

      - name: Export targets (check:exports)
        working-directory: dsh-cc
        run: pnpm check:exports

      - name: Unit tests (vitest)
        working-directory: dsh-cc
        run: pnpm test

      - name: check:subagent-paste
        working-directory: dsh-cc
        run: pnpm check:subagent-paste

      - name: Resolve dist-tag (prerelease → next; stable → latest)
        run: |
          case "${TAG#v}" in
            *-*) echo "DIST_TAG=next" >> "$GITHUB_ENV" ;;
            *)   echo "DIST_TAG=latest" >> "$GITHUB_ENV" ;;
          esac

      # Either/or auth: NPM_TOKEN present → token auth (bootstrap); absent →
      # no static credential is configured and pnpm 11.7 automatically falls
      # back to OIDC trusted publishing
      - name: Registry auth (token bootstrap | OIDC flip)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
            echo "auth mode: NPM_TOKEN (bootstrap)"
          else
            echo "auth mode: OIDC trusted publishing (no static token configured)"
          fi

      # --no-git-checks: we checkout a tag (detached HEAD). pnpm 11.7 still
      # enforces publish-branch=master|main under -r, so the default git
      # checks fail with ERR_PNPM_GIT_UNKNOWN_BRANCH. Ancestry + version
      # gates above already cover "is this the intended commit".
      # Sequential + 8s gap: npm rate-limits first publishes on a new
      # scope (~20–30 PUTs / few minutes). pnpm -r fires them back-to-back
      # and dies mid-set with E429. The script skips versions already on
      # the registry, so reruns only attempt the remainder.
      - name: Publish all packages (skips versions already on the registry)
        working-directory: dsh-cc
        env:
          PUBLISH_DELAY_MS: 8000
        run: node scripts/publish-packages.mjs --tag "$DIST_TAG" --provenance --no-git-checks

      - name: GitHub Release
        working-directory: dsh-cc
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          extra=(); [ "$DIST_TAG" = "next" ] && extra+=(--prerelease)
          gh release create "$TAG" "${extra[@]}" --generate-notes --verify-tag
