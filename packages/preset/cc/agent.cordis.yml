# BEGIN dsh-cc header
# dsh-cc "CC mode" agent preset declaration (thin wrapper, VWA split
# docs/plans/2026-10-12-verifiable-workspace-agent.md §3.1): the shared row
# body lives in agent.shared.cordis.yml (included below); this file adds only
# the preset's own persona. After upgrading dsh upstream, re-diff the shared
# body against the new standard preset (the drift gate in
# tests/composition.spec.ts automates this) and fold in any upstream changes.
# END dsh-cc header
- id: cc-shared
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./agent.shared.cordis.yml

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
# This row lives ONLY here and in agent.vwa.cordis.yml — a second persona row
# in one scope fails section registration ("already registered in this
# scope"), so the shared body carries none.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

# The /preset command (VWA plan docs/plans/2026-10-12-verifiable-workspace-agent.md
# §3.2): lists the agent-preset roster and switches the session/default preset.
# Double-written into agent.cordis.yml and agent.vwa.cordis.yml — never the
# shared body — so each preset carries its own switch-back surface. It reads
# `agentPresets` with a loud apply-time ctx.get (an inject declaration would
# re-compose the registry inside this preset scope) and registers the
# `vwa-preset` settings namespace at mount.
- id: command-preset
  name: '@dsh-cc/command-preset'