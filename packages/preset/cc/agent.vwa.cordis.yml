# BEGIN dsh-cc header
# dsh-cc "VWA mode" agent preset declaration (VWA split
# docs/plans/2026-10-12-verifiable-workspace-agent.md §3.1): the shared row
# body lives in agent.shared.cordis.yml (included below); this file adds only
# the VWA persona. Co-located include paths resolve relative to the including
# file, so the inner path is `./agent.shared.cordis.yml`.
# Writing behavior for lane-1 documents: docs/vwa/writing-guidance.md
# (marker discipline, turn-end verification loop, delivery states).
# END dsh-cc header
- id: vwa-shared
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./agent.shared.cordis.yml

# The VWA persona, shadowing the deployment default for this agent. Lives ONLY
# here and in agent.cordis.yml — a second persona row in one scope fails
# section registration ("already registered in this scope").
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}. VWA mode turns the agent toward verifiable workspace deliverables — technical documents, research artifacts. Verifiable claims in documents should carry 〔src:ws:<path>#La-Lb〕 markers citing workspace files.

# The /preset command (VWA plan §3.2), double-written with agent.cordis.yml —
# never the shared body — so VWA sessions can switch back to cc. Same wiring
# notes as the cc twin: loud apply-time `ctx.get('agentPresets')`, and the
# `vwa-preset` settings namespace registers at mount.
- id: command-preset
  name: '@dsh-cc/command-preset'

# The vwa-evidence turn-stopping evaluator (VWA plan §4.4/§4.5), mounted ONLY
# here — the cc preset deliberately lacks this row (§4.4: cc sessions stay
# untouched; `vwa-evidence.enabled:false` is only an off valve inside vwa).
# Top-level row placement is the judged precedent: command-preset passed
# smoke that way (plain plugin, publishes no Service; `inject = ['shell']`
# post-edit-verify idiom for the §4.3 gate C execution seam).
- id: vwa-evidence
  name: '@dsh-cc/vwa-evidence'
