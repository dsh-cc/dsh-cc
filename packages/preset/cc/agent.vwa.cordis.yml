# BEGIN dsh-cc header
# dsh-cc "VWA mode" agent preset declaration (VWA split
# docs/plans/2026-10-12-verifiable-workspace-agent.md §3.1): the shared row
# body lives in agent.shared.cordis.yml (included below); this file adds only
# the VWA persona. Co-located include paths resolve relative to the including
# file, so the inner path is `./agent.shared.cordis.yml`.
# Writing behavior for lane-1 documents: docs/vwa/writing-guidance.md
# (marker discipline, turn-end verification loop, delivery states).
# END dsh-cc header
- id: vwa-shared
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./agent.shared.cordis.yml

# The VWA persona, shadowing the deployment default for this agent. Lives ONLY
# here and in agent.cordis.yml — a second persona row in one scope fails
# section registration ("already registered in this scope").
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}. VWA mode turns the agent toward verifiable workspace deliverables — technical documents, research artifacts. Verifiable claims in documents should carry 〔src:ws:<path>#La-Lb〕 markers citing workspace files. Document writes use the file editing tools (write/edit), never shell redirection — bash-redirect edits are invisible to the evidence pipeline.

# The /preset command (VWA plan §3.2), double-written with agent.cordis.yml —
# never the shared body — so VWA sessions can switch back to cc. Same wiring
# notes as the cc twin: loud apply-time `ctx.get('agentPresets')`, and the
# `vwa-preset` settings namespace registers at mount.
- id: command-preset
  name: '@dsh-cc/command-preset'

# The VWA evidence lanes (VWA plan §4.4/§4.5; split plan
# docs/plans/2026-10-16-vwa-evidence-argument.md §23), mounted ONLY here —
# the cc preset deliberately lacks these rows (cc sessions stay untouched;
# `vwa-evidence.enabled:false` is only an off valve inside vwa).
#
# - vwa-evidence: the lane-1 turn-stopping evaluator. Plain plugin, publishes
#   no Service; `inject = ['shell']` (post-edit-verify idiom) for the §4.3
#   gate C execution seam.
# - vwa-argument: the lane-2 argumentation plugin (settings namespace, the
#   /vwa command, and — only when `vwa-argument.semantic-enabled` is true —
#   the author tools, the capture wiring, and the `vwa-argument` delivery
#   SERVICE (§13; default-off, so mounting changes nothing until enabled).
#
# Because vwa-argument publishes a Service, the pair sits in a group whose
# `isolate` realm covers it (the agent.shared.cordis.yml service-row rule:
# without it the service lands in the root realm and the preset mount
# rejects it as leaked). vwa-evidence must share the realm: it reads the
# service with a scoped ctx.get, which cannot cross an isolate boundary. It
# resolves the service per turn, so the row order inside the group does not
# matter.
- id: vwa-lanes
  name: cordis:group
  group: true
  isolate:
    vwa-argument: true
  config:
    - id: vwa-evidence
      name: '@dsh-cc/vwa-evidence'

    - id: vwa-argument
      name: '@dsh-cc/vwa-argument'
