# Agent Client Protocol surface for the `acp` profile. Host-plane swap only:
# insert the preset roster (default: cc) and the ACP protocol driver; swap the
# harness acp plugin.
#
# This bundle declares no agent-plane disables. The host copies are vacated by
# @dsh-cc/bundle-shell (shared with the TUI lane), and the hmr lane stays off
# via the retained @deepseek-ai/dsh-acp-app bundle's explicit `hmr disabled`
# row — the base predicate only disables hmr when NO profile is active, so this
# bundle must not (and cannot) re-disable it.
#
# Must NOT touch: tools (cc-shell remounts tools-cc), settings /
# permission-rules (cc-permissions), user-questions, HTTP/webserver rows.

- insert:
    # Harness >=0.1.7-rc.2 agent-preset architecture (G15): the registry owns
    # the roster and the declaration row below IS the cc roster. The
    # composition is carried by reference: the file-backed include row mounts
    # @dsh-cc/preset-cc/agent.cordis.yml from the profile's node_modules (a
    # hard dependency of @dsh-cc/bundle-acp), keeping that tested file the
    # single source of the cc composition. Same block as cc-tui.
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: cc

    - id: preset-cc
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: cc
        name: CC mode
        description: Full Standard-mode capability, plus the Claude Code surface — .claude plugin directories, Claude hooks, slash commands, persistent memory, output styles, and fetch-enabled Web tools.
        order: 5
        plugins:
          - id: cc-composition
            name: '@deepseek-ai/cordis-plugin-include'
            config:
              path: node_modules/@dsh-cc/preset-cc/agent.cordis.yml

    - id: acp-cc
      name: '@dsh-cc/acp'
      inject: [acpAppStartup]
      config:
        presetId: 'cc'
        # Optional route override — uncomment and set to pin the model plane:
        # provider: !!js process.env.DSH_CC_PROVIDER
        # model: !!js process.env.DSH_CC_MODEL

# Swap of the harness @deepseek-ai/dsh-acp plugin (P3-proven). This row only
# exists because the dsh-acp-app bundle stays in the floor: the `acp` row is
# inserted by acp-app, not dsh-base, so disabling by ID replaces it.
- id: acp
  disabled: true

# bundle-shell's CC title provider would pay a title-model call per session;
# the ACP lane does not consume titles.
- id: session-title-llm-cc
  disabled: true
