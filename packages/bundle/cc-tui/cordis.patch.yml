# Terminal surface for the `tui` profile. Host-plane swap only:
# disable HMR and the host copies of agent-plane rows (same list as
# dsh-web-app) so the CC preset owns tools. Insert the preset roster
# (default: cc) and the TUI protocol driver.
#
# Must NOT touch: tools (cc-shell remounts tools-cc), settings /
# permission-rules (cc-permissions), user-questions (TUI registers a
# provider), HTTP/webserver/api-gateway.

- id: hmr
  disabled: true

# ── agent plane moves behind the CC preset ─────────────────────────────────
# Disabling rather than deleting is deliberate: the base is shared.

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: tool-jobs
  disabled: true

- id: tool-fs
  disabled: true

- id: tool-fs-search
  disabled: true

- id: tool-str-replace-editor
  disabled: true

- id: skill-filesystem
  disabled: true

- id: tool-skill
  disabled: true

- id: tool-goal
  disabled: true

- id: plan-mode
  disabled: true

- id: compaction-basic
  disabled: true

- id: command-compact
  disabled: true

- id: tool-result-pruner
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: workflow-worker-thread
  disabled: true

- id: tool-workflow
  disabled: true

- id: tool-ralph
  disabled: true

- id: agent-instructions
  disabled: true

- id: tool-todo
  disabled: true

- id: tool-web
  disabled: true

- insert:
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: cc

    - id: tui
      name: '@dsh-cc/tui'
      inject: [agents]
      config:
        cwd: !!js process.cwd()
        agentPreset: cc
        sessionId: !!js process.env.DSH_CC_RESUME_SESSION
        autoResume: !!js process.env.DSH_CC_AUTO_RESUME === '1'
        continueRequested: !!js process.env.DSH_CC_CONTINUE === '1'
        provider: !!js process.env.DSH_CC_PROVIDER
        model: !!js process.env.DSH_CC_MODEL
        # Fullscreen on entry: the transcript scrolls inside a primary
        # ScrollView while the dock (queue/todos/overlays/editor/statusline)
        # stays pinned at the bottom. Opt out per-launch with
        # DSH_CCTUI_UI_MODE=regular.
        uiMode: fullscreen
