# Terminal surface for the `tui` profile. Host-plane swap only: disable HMR
# and insert the preset roster (default: cc) plus the TUI protocol driver.
#
# The host copies of the agent-plane rows (tools, skills, subagents, plan mode,
# compaction, workflow/ralph, instructions, todo, web) are vacated by
# @dsh-cc/bundle-shell, not here — the vacating is a property of the shell
# layer, and this bundle no longer restates it.
#
# Must NOT touch: tools (cc-shell remounts tools-cc), settings /
# permission-rules (cc-permissions), user-questions (TUI registers a
# provider), HTTP/webserver/api-gateway.

- id: hmr
  disabled: true

- insert:
    # Harness >=0.1.7-rc.2 agent-preset architecture (G15): the old
    # @deepseek-ai/dsh-agent-presets package and its filesystem scanner
    # (includeShippedRoot, ~/.dsh/.agent-presets) are deleted upstream. The
    # registry owns the roster and the declaration row below IS the cc
    # roster. The composition is carried by reference: the file-backed
    # include row mounts @dsh-cc/preset-cc/agent.cordis.yml from the
    # profile's node_modules (a hard dependency of @dsh-cc/tui), keeping
    # that tested file the single source of the cc composition.
    # Runtime-scoped MCP tool deferral registry: mounts once per runtime at
    # the bundle layer (outside every preset standing mount). It used to sit
    # in the cc-services preset group; with `toolSearch` deliberately
    # non-isolated (so root-mounted mcp-client fibers can resolve the seam),
    # a preset-row provide would trip the preset leakedServices gate
    # ("Preset services require isolate realms: toolSearch"), which broke
    # smoke:profile-boot. Do not re-add the row to any preset body.
    - id: tool-search
      name: '@dsh-cc/tool-search'

    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: cc

    - id: preset-cc
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: cc
        name: CC mode
        description: Full Standard-mode capability, plus the Claude Code surface — .claude plugin directories, Claude hooks, slash commands, persistent memory, output styles, and fetch-enabled Web tools.
        order: 5
        plugins:
          - id: cc-composition
            name: '@deepseek-ai/cordis-plugin-include'
            config:
              path: node_modules/@dsh-cc/preset-cc/agent.cordis.yml

    - id: preset-vwa
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: vwa
        name: VWA mode
        description: CC mode plus verifiable deliverable receipts for documents and research artifacts.
        order: 6
        plugins:
          - id: vwa-composition
            name: '@deepseek-ai/cordis-plugin-include'
            config:
              path: node_modules/@dsh-cc/preset-cc/agent.vwa.cordis.yml

    - id: tui
      name: '@dsh-cc/tui'
      inject: [agents]
      config:
        cwd: !!js process.cwd()
        agentPreset: cc
        sessionId: !!js process.env.DSH_CC_RESUME_SESSION
        autoResume: !!js process.env.DSH_CC_AUTO_RESUME === '1'
        continueRequested: !!js process.env.DSH_CC_CONTINUE === '1'
        provider: !!js process.env.DSH_CC_PROVIDER
        model: !!js process.env.DSH_CC_MODEL
        # Fullscreen on entry: the transcript scrolls inside a primary
        # ScrollView while the dock (queue/todos/overlays/editor/statusline)
        # stays pinned at the bottom. Opt out per-launch with
        # DSH_CCTUI_UI_MODE=regular.
        uiMode: fullscreen
