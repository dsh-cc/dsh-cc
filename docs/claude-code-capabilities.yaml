      - { type: source, path: packages/settings/settings-cascade/src/cc-key-aliases.ts, anchor: "CC_KEY_ALIASES" }
      - { type: source, path: packages/ui/tui/src/harness/statusline-settings.ts, anchor: "describeStatusLine" }
      - { type: source, path: packages/ui/tui/src/harness/statusline-payload.ts, anchor: "buildStatusLinePayload" }
      - { type: source, path: packages/ui/tui/src/harness/usage-view.ts, anchor: "lastBucketsOf" }
      - { type: test, path: packages/ui/tui/tests/driver-statusline.spec.ts }
      - { type: test, path: packages/ui/tui/tests/statusline-command.spec.ts }
      - { type: test, path: packages/ui/tui/tests/statusline-settings.spec.ts }
      - { type: test, path: packages/ui/tui/tests/statusline-payload.spec.ts }
      - { type: test, path: packages/ui/tui/tests/statusline-cc-transcript.spec.ts }
      - { type: test, path: packages/settings/settings-cascade/tests/cc-key-aliases.spec.ts }
    deviation:
      kind: downgrade
      summary: >-
        The command's stdout is rendered as multiple status-line rows capped
        at 3 (CC renders every row as its own status-line row); when the
        custom statusline is active, dsh-cc appends one client-drawn row
        below the command output carrying the permission mode + key hints
        (`<mode> · shift+tab · /quit`) — the stdin payload carries no
        permission-mode field (CC's doesn't either; CC renders that row as
        its own chrome). A 60 s hard run cap and a 64 KiB stdout cap are
        enforced (CC documents no timeout), and no debug-mode failure output
        is logged for the statusline command. The stdin payload omits fields
        with no truthful runtime source: version, output_style.name,
        worktree, workspace.git_worktree, workspace.repo, session_name,
        prompt_id, fast_mode, thinking, vim, agent, pr,
        cost.total_cost_usd / total_api_duration_ms / total_lines_* —
        context_window.current_usage IS emitted with CC field names
        (input_tokens / output_tokens / cache_creation_input_tokens /
        cache_read_input_tokens), truthfully sourced from the harness token
        usage projection's last-step buckets; steps cancelled or failed
        mid-flight may leave partial usage in that snapshot (documented
        staleness). used_percentage / remaining_percentage are derived from
        the currentUsage context length when present (fallback: the projected
        pressure sample; omitted when neither source exists).
        display_name duplicates model.id; exceeds_200k_tokens uses the
        currentUsage context length and is omitted when no occupancy source
        exists. transcript_path points at the dsh-cc-maintained CC-shape
        plaintext transcript mirror when it is ready (see
        ux.statusline-cc-transcript).
        hideVimModeIndicator is parsed but behaviorally inert (no vim mode
        yet); disableAllHooks / allowManagedHooksOnly gating keys are
        unimplemented. External settings.json edits apply at the next boot
        (no file watcher; in-process settings commits react immediately).
        refreshInterval is honored in seconds with a minimum clamp of 1.

  ux.statusline-cc-transcript:
    title: CC-shape plaintext transcript mirror for the custom statusline
    category: ux
    plane: host
    upstream:
      summary: >-
        CC's stdin payload carries a transcript_path pointing at a plain-text
        JSONL session transcript that statusline consumers (e.g. ccstatusline)
        parse for context-window and cost figures. dsh-cc's native session
        artifact is zstd-compressed private-format JSONL, unreadable by such
        consumers.
      refs:
        - { source: cc-docs, path: /docs/en/statusline, retrieved: '2026-09-05' }
    dimensions:
      recognized: true
      mounted: true
      behavioral: divergent
      ux: partial
    evidence:
      - { type: source, path: packages/ui/tui/src/harness/statusline-cc-transcript.ts, anchor: "createCcTranscriptMirror" }
      - { type: test, path: packages/ui/tui/tests/statusline-cc-transcript.spec.ts }
    deviation:
      kind: divergent
      summary: >-
        When the custom statusline is active, dsh-cc maintains a CC-shape
        plaintext transcript mirror at $DSH_HOME/tui/cc-transcripts/<sessionId>.jsonl
        (assistant usage lines + user anchor lines, atomic rebuild on
        bind/rebind, seq-watermarked appends) and the statusline payload's
        transcript_path advertises the mirror only once it is ready (>=1 usage
        line), instead of the dsh zstd-compressed private-format session
        artifact that CC-shape consumers cannot parse. The mirror is a filtered
        projection (usage + anchor lines only), not a full transcript. Hook
        payloads (packages/hooks/hooks-claude-code/src/payloads.ts) still point
        transcript_path at the dsh session artifact.
