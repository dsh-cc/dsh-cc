      - { type: test, path: packages/hooks/hooks-claude-code/tests/error-recovery.spec.ts }
    deviation:
      kind: divergent
      summary: >-
        Notice-level rather than an internal retry cap (request retry is
        harness-owned), and streaks are per-agent.id where CC's caps are
        session-wide; the consecutive counter resets on every real user
        prompt, so cross-prompt streaks do not accumulate.

