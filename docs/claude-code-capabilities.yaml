      - { type: test, path: packages/interaction/post-edit-verify/tests/composition.spec.ts }
    deviation:
      kind: divergent
      summary: >-
        dsh-cc extension (user-layer-only setting cc-post-edit-verify, rules
        {glob, command, timeout-ms}): after an accepted edit/write result, a
        fast POSIX-shell verification command runs through the harness
        ShellExecutor and its outcome is APPENDED to the same tool result as
        an `[auto-verify]` text block — one observation covers both events,
        no extra model round-trip. Appended text, not replacement: divergent
        vs PostToolUse `updatedToolOutput`. Default off; burst labeling via
