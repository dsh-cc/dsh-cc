  hooks.worktree-events:
    title: WorktreeCreate/WorktreeRemove hooks
    category: hooks
    plane: preset
    upstream:
      summary: >-
        Fires when a worktree is created (with its name, path, branch, and
        origin: `--worktree` flag, EnterWorktree, or subagent isolation) and
        when it is removed (`exit`, `subagent-finished`, `sweep`). A
        WorktreeCreate hook exiting 0 with a stdout path replaces default
        creation (the path is adopted after a git-identity check; a
        metadata-less directory is accepted only when no git repository
        contains it); a WorktreeRemove hook replaces default removal and a
        failing hook keeps the tree.
      refs:
        - { source: cc-docs, path: /docs/en/hooks-guide, retrieved: '2026-09-14' }
        - { source: cc-docs, path: /docs/en/hooks, retrieved: '2026-09-14' }
    dimensions:
      recognized: true
      mounted: true
      behavioral: partial
      ux: partial
    evidence:
      - { type: source, path: packages/preset/cc/agent.cordis.yml, anchor: "- id: hooks-claude-code" }
      - { type: source, path: packages/hooks/hooks-claude-code/src/run-point.ts, anchor: "HookRunResult" }
      - { type: test, path: packages/hooks/hooks-claude-code/tests/worktree-events.spec.ts }
      - { type: source, path: packages/workspace/tool-git-worktree/src/hooks.ts, anchor: "runWorktreeCreateHook" }
      - { type: test, path: packages/workspace/tool-git-worktree/tests/hooks.spec.ts }
    deviation:
      kind: downgrade
      summary: >-
        Launcher-side lifecycles cannot run hooks: the pre-build `bin/dsh-cc.js`
        has no hooks bridge, so `--worktree` (`worktree-flag`) creation and the
        boot-time sweep (`sweep`) removal keep their git-direct behavior — the
        two source values exist in the payload type for CC-shape parity. The
        in-process points (EnterWorktree/ExitWorktree, subagent isolation, TUI
        /quit cleanup) run the hooks through the bridge's `hookRun` invoke
        seam.
