        never rewritten).
      refs: []
    dimensions:
      recognized: true
      mounted: true
      behavioral: full
      ux: partial
    evidence:
      - { type: source, path: packages/preset/cc/agent.cordis.yml, anchor: "- id: edit-recovery-hint" }
      - { type: source, path: packages/interaction/edit-recovery-hint/src/wiring.ts, anchor: "ctx.on('tools/post-execute'" }
      - { type: test, path: packages/interaction/edit-recovery-hint/tests/wiring.spec.ts }
      - { type: test, path: packages/interaction/edit-recovery-hint/tests/hint.spec.ts }
    deviation:
      kind: divergent
      summary: >-
        dsh-cc extension (user-layer-only setting cc-edit-recovery-hint,
        enabled default false): on an edit-tool FS_EDIT_NOT_FOUND failure of a
        multi-line old_string, a FIXED static recovery-advice message (anchor
        to a single-line old_string, or split per-hunk) is appended as an
        additionalContexts entry on the accept decision — same
        deferContext delivery surface as PostToolUse additionalContext, but
        triggered in-process via tools/post-execute with no subprocess. Static
        text only: no tool-output interpolation. No Claude Code equivalent.

  engine.error-streak-surfacing:
    title: Agent-error streak surfacing
    category: engine
    plane: preset
    upstream:
      summary: >-
        CC caps its own internal retry loops (3 consecutive / 20 cumulative,
        from production telemetry) before escalating. In dsh-cc the request
        retry loop is harness-owned, so the bridge surfaces the burn pattern
        instead: per-agent consecutive/total agent/error counters trip a
        durable user notice once each (CLAUDE_CODE_AGENT_ERROR_CONSECUTIVE_CAP,
        CLAUDE_CODE_AGENT_ERROR_TOTAL_CAP).
      refs:
        - { source: cc-docs, path: /docs/en/hooks, retrieved: '2026-09-15' }
        - { source: cc-docs, path: /docs/en/errors, retrieved: '2026-09-15' }
    dimensions:
      recognized: true
      mounted: true
      behavioral: partial
      ux: partial
    evidence:
