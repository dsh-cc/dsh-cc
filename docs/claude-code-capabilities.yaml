  engine.output-token-continuation:
    title: Output-token continuation
    category: engine
    plane: preset
    upstream:
      summary: >-
        When the model hits its output ceiling, CC resumes mid-thought with a
        meta continuation message (max 3 continuations; the recovery is
        invisible when it succeeds). dsh-cc realizes this at the
        agent/turn-stopping seam: if the LAST assistant attempt's stream ended
        on a max-tokens finish, a CC-worded resume message is steered (up to
        CLAUDE_CODE_OUTPUT_TOKEN_CONTINUATION_CAP, default 3, 0 disables) and
        Stop is skipped for that stopping; a recovered completion or an
        exhausted cap falls through to the normal Stop path.
      refs:
        - { source: cc-docs, path: /docs/en/errors, retrieved: '2026-09-15' }
        - { source: cc-docs, path: /docs/en/sub-agents, retrieved: '2026-09-15' }
    dimensions:
