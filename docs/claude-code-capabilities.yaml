  # ── permissions ─────────────────────────────────────────────────────────
  permissions.rules:
    title: Permission rules
    category: permissions
    plane: host
    upstream:
      summary: >-
        Rule engine with allow/deny/ask, risk classification, durable
        permission modes, and always-allow rule persistence.
      refs: []
    dimensions:
      recognized: true
      mounted: true
      behavioral: partial
      ux: partial
    evidence:
      - { type: test, path: packages/interaction/permission-rules/tests/mode.spec.ts, anchor: "bypassPermissions" }
      - { type: test, path: packages/interaction/permission-rules/tests/classifier.spec.ts }
      - { type: test, path: packages/interaction/permission-rules/tests/auto-stage.spec.ts }
      - { type: test, path: packages/interaction/permission-rules/tests/listener-auto-stage.spec.ts }
      - { type: test, path: packages/interaction/permission-rules/tests/llm-classifier.spec.ts, anchor: "R2: timer fires but the stream silently resolves garbage" }
      - { type: test, path: packages/interaction/permission-rules/tests/llm-classifier.spec.ts, anchor: "R5: debug sink present" }
      - { type: test, path: packages/interaction/permission-rules/tests/auto-stage.spec.ts, anchor: "trailingRouteFailureStreak" }
      - { type: test, path: packages/ui/tui/tests/driver-classifier-breaker.spec.ts, anchor: "a live breaker event surfaces the fallback notice once" }
      - { type: source, path: packages/interaction/permission-rules/src/auto-stage.ts, anchor: "createAutoStage" }
      - { type: test, path: packages/settings/settings-cascade/tests/auto-mode.spec.ts }
      - { type: test, path: packages/ui/tui/tests/approval-preview.spec.ts }
      - { type: test, path: packages/ui/tui/tests/driver-default-mode.spec.ts, anchor: "createDriver live defaultMode display (F1)" }
      - { type: test, path: packages/interaction/permission-rules/tests/permission-rules.spec.ts, anchor: "defaultMode getter (live merged settings default)" }
    deviation:
      kind: downgrade
      summary: >-
        Rule engine + dangerous-command/path risk classifier, durable modes
        (default/acceptEdits/plan/auto/bypassPermissions via /permissions),
        plan deny with exit_plan_mode guidance, bypassPermissions pinning
        danger-full-access with resumeSandbox restore, and the always-allow
        derived-rule persistence all work. `auto` mode additionally gains an
        opt-in, escalate-only LLM risk-classifier stage: a one-shot auxiliary
        model verdict over tool name + rendered parameters (never tool
        results, input wrapped as an explicit DATA block the model is
        instructed never to repeat, quote, or follow), fail-to-ask on every
        classifier failure, `$defaults`
        soft-deny prose expansion, a verdict LRU cache, and durable
        `permission/classifier` session audit events (armed only when enabled,
        an llm service is mounted, and the alias route resolves). Read-only
        tool calls are exempt: they never invoke the classifier (the legacy
        auto path applies). Verdict parsing stays strict and fail-closed — a
        malformed output yields the constant reason "classifier output
        unparseable" (model output never reaches the modal; the audit record
        is digest-only). A per-route consecutive-failure circuit breaker
        (threshold 3, keyed provider/model) opens the stage for a failing
        lane: no further classifier calls on that route, one warn per process,
        one `breaker` audit event per session, reset by a settings change
        (rebuild). The breaker is restart-durable within a session: the first
        call of a session seeds the per-route streak from the durable log
        (attributed events only; a restored streak ≥ threshold opens at seed
        time). An open breaker surfaces one visible TUI fallback notice per
        session (live-appended `breaker` events only — never replayed logs),
        and caller-cancelled classifications are tagged `cancelled`, never
        breaker-counted. Raw model output is debuggable via the opt-in
        `DSH_PERMISSION_CLASSIFIER_DEBUG=1` process-log channel
        (`[dsh:classifier:raw]`, truncated to 2 KiB — never session events).
        Defaults: `timeoutMs` 8000, verdict budget 1024 tokens. The UI honors
        `permissions.defaultMode`: statusline,
        session switch, Shift+Tab cycle start, and the /permissions picker all
        fall back to the live merged settings default (fold precedence — a
        recorded session mode still wins), with the cycle clamped to its
        members.
        Settings-surface deviation: the auto-mode section is delivered as
        `permissions.autoMode` — an `autoMode` key inside the existing
        `permissions` namespace (camelCase key in a kebab namespace, like
        `defaultMode`), NOT Claude Code's root-level `autoMode` key, because
        top-level settings namespaces must be kebab-case upstream. Other
        documented CC auto-mode divergences (explicit ask rules still proxied
        to allow in auto; same-source allow-before-deny) remain recorded as
        unfixed follow-ups — they are not addressed or masked here. Remaining
        vs CC: managed/enterprise remote settings, UI mode cycle; the upstream
        permission/mode catalog pin is an upstream polish.

