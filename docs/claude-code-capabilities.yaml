  subagents.task-tool:
    title: Subagents / Agent tool / teams
    category: subagents
    plane: preset
    upstream:
      summary: >-
        Task tool dispatching subagents from .claude/agents definitions with
        model aliases, tool filters, background/continuable runs, and
        TaskOutput collection.
      refs:
        - { source: cc-docs, path: /docs/en/sub-agents, retrieved: '2026-09-03' }
        - { source: cc-docs, path: /docs/en/plugins-reference, retrieved: '2026-09-03' }
    dimensions:
      recognized: true
      mounted: true
      behavioral: divergent
      ux: partial
    evidence:
      - { type: source, path: packages/preset/cc/agent.cordis.yml, anchor: "- id: tool-task" }
      - { type: source, path: packages/preset/cc/agent.cordis.yml, anchor: "- id: cc-resume-pins" }
      - { type: test, path: packages/subagent/task/tests/tool.spec.ts }
      - { type: test, path: packages/subagent/task/tests/epoch-collector.spec.ts }
      - { type: test, path: packages/subagent/task/tests/suppress-settled.spec.ts }
      - { type: test, path: packages/subagent/task/tests/integration.spec.ts }
      - { type: test, path: packages/subagent/task/tests/registry-publication.spec.ts }
      - { type: source, path: packages/subagent/task/src/preload-tools.ts }
      - { type: test, path: packages/subagent/task/tests/preload-tools.spec.ts }
      - { type: test, path: packages/ui/tui/tests/promote-key.spec.ts }
      - { type: test, path: packages/subagent/resume-pins/tests/gate.spec.ts }
      - { type: test, path: packages/bundle/cc-shell/tests/resume-pins-composition.spec.ts }
      - { type: source, path: packages/compat/cc-plugin-loader/src/agents.ts }
      - { type: source, path: packages/subagent/task/src/plugin-agents.ts }
      - { type: test, path: packages/subagent/task/tests/plugin-agents.spec.ts }
      - { type: test, path: packages/compat/cc-plugin-loader/tests/dsh-cc-agents.spec.ts }
      - { type: source, path: CLAUDE.md }
      - { type: source, path: packages/plugin/dsh-cc-agents/skills/dsh-cc-agents-orchestration/SKILL.md }
      - { type: source, path: packages/subagent/resume-pins/src/plugin.ts }
    deviation:
      kind: divergent
      summary: >-
        subagent_type dispatch over per-workspace .claude/agents (persona =
        definition systemPrompt, alias routing via ccModelRoutes, sanitized
        toolFilter, maxDepth 3, bundled explore/dsh-cc-guide agents, the
        bundled explore additionally carrying read-only serena symbol
        retrieval tools mcp__serena__find_symbol /
        find_referencing_symbols / get_symbols_overview) plus the
        continuable background loop (run_in_background, agentId-addressable
        send_message/interrupt/list). Deliberate deviations: fork + background
        is rejected naming upstream issue #2124 (fork stays foreground
        one-shot); no TaskOutput alias and no outputFile field; omitting
        run_in_background stays foreground unless the definition pins
        background: true, unlike Claude Code's interactive omit=background.
        Pinned defaults (repo-guarded): the official plugin agent
        dsh-cc-agents:critic pins background: true, so omitting
        run_in_background on those Task calls launches them continuable in
        the background (the call resolves { status: 'async_launched' }
        immediately and the real result arrives later as a wake message — no
        inline result to compose on); run_in_background: false forces
        synchronous collection. Deliberate deviation on pins:
        dsh-cc-agents:executor and dsh-cc-agents:marathon ship NO pin — a
        mutating agent defaults to foreground so the delegator verifies its
        report before composing — and there is NO global omit=background
        default either: the bundled
        explore and dsh-cc-guide agents stay unpinned and keep foreground
        first-epoch collect.
        Foreground collect refit: non-fork foreground calls (named agents and
        general-purpose) collect the child's first epoch INLINE as a
        continuable child — same pin preallocation, pre-start pin write, and
        tombstone-on-throw as the background path, so a foreground-launched
        child is pinnable/resumable exactly like a background one. The
        collector is a dsh-cc-INTERNAL parity instrument (bus watcher over
        subagent/start + subagent/end, one shared listener pair and watch
        map, matched by first-epoch runId; docs/plans/
        2026-09-05-epoch-collector-dsh-cc.md), NOT a Claude Code mechanism —
        declared deviations: (1) for inline-collected epochs the settlement
        account lives only in the tool result, not the parent session log
        (the duplicated subagent-settled notice is dropped by a pop-once
        pre-step filter; a promoted child is removed from the set and
        delivers normally); (2) on exec.signal abort the child is interrupted
        aborted exactly once via ctx.subagents.interrupt({kind:'ancestor'}) and the
        tool call resolves PROMPTLY with a synthetic stopReason "aborted"
        (never awaiting child quiescence; the real terminal arrives only as
        the suppressed notice); (3) a seam without interrupt degrades to a
        prompt resolve without child interrupt. Output schema gains optional
        backgroundedByUser: true (set by the Slice 3 promotion path, never by
        Slice 2 code paths).
        Ctrl+B promotion (TUI-only surface): while the dialog is busy AND the
        root-realm ccCollectorRegistry (published by the cc-subagent-task
        plugin, CcPlugins pattern) has ≥1 armed foreground collect for THIS
        session AND CLAUDE_CODE_DISABLE_BACKGROUND_TASKS is unset, Ctrl+B
        promotes EVERY armed collect of the session: the pending tool call
        resolves { status: 'async_launched', agentId, backgroundedByUser:
        true }, the watch is released (the runId-matched end later resolves
        nothing), the child is REMOVED from the suppression set so its
        settlement notice delivers exactly once normally, and the TUI echoes
        one status line. Pre-acceptance promotion (Ctrl+B fired while
        startContinuable is still in flight) resolves async_launched as soon
        as start resolves. Repeated presses are idempotent (a promoted
        collect unregisters itself; the second press is a consumed no-op).
        Declared deviations: promotion is a TUI-only surface — non-TUI
        clients have NO promotion path; busy Esc/Ctrl+C still interrupts
        (every registered collect of the session aborts exactly-once with a
        prompt synthetic aborted resolution); idle Ctrl+B is untouched (the
        editor's tui.editor.cursorLeft binding); under tmux, Ctrl+B is the
        default prefix — double-press passes a literal Ctrl+B through
        (send-prefix) and the Ctrl+X Ctrl+B chord is P1 (not implemented).
        Env kill switch CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: a non-empty
        value other than case-insensitive 0/false disables the
        backgrounding-by-default pins (omissions collect in foreground) —
        explicit run_in_background true/false arguments remain honored both
        ways. Deliberate partial-parity deviation: upstream Claude Code's
        exact precedence for this env var is unverified, so the argument
        precedence is declared rather than asserted as parity.
        Capacity guard: the Task tool refuses a new continuable child
        (background OR foreground collect) when the parent already has 25
        live children (listChildren entries with activity running) with the
        actionable error "parent has 25 live subagents; /agents stop <id> to
        release one, or let children settle" — a dsh-cc-side safety valve;
        Claude Code has no equivalent surfaced limit.
        Continuable cold resume: each background spawn captures a resume pin
        (resolveDetailed-selected alias plus maxTokens) into the resumePinStore
        service (preset row cc-resume-pins, isolated as resumePinStore in
        cc-services), and resume restores the pinned tuple INCLUDING explicit
        absence (a pin recording an unset reasoningEffort/maxTokens is honored
        as absent rather than re-resolved); a pinned model the parent can no
        longer resolve is gated by the subagents-resume settings namespace
        (subagents-resume.onUnavailableModel: block|route-current, default
        block) with deny codes SUBAGENT_MODEL_UNAVAILABLE /
        WORKSPACE_CHANGED / DEFINITION_CHANGED / PINNED_TOOL_UNAVAILABLE /
        PIN_ORPHANED / PIN_UNREADABLE naming the policy knob — Claude Code has
        no equivalent mechanism.
        Spawn-time preload (dsh-cc-side, no Claude Code equivalent): an
        explicit `tools:` entry that is still a deferred MCP tool is
        activated through the duck-typed ctx.toolSearch seam at spawn, BEFORE
        the child starts, on BOTH dispatch paths — activation is
        process-global (every admitting agent's schema grows after the
        spawn); wildcard entries are restrict-only, deny/sanitize-excluded
        names are never activated, eager names are skipped, and outcomes
        surface in the Task result text (Preloaded deferred tools for child /
        Not preloaded: name (reason)).
        Plugin-agent dispatch (dsh-cc-side, CC-parity): plugin agents are
        dispatched by CC-style scoped ids `plugin:agent` — file definitions
        and scoped ids occupy disjoint name spaces (file definitions whose
        agentType contains `:` are skipped with a warning so the scoped-id
        namespace stays unambiguous) and bare plugin names are not
        addressable, matching Claude Code. Plugin definitions are enumerated
        live from the `subagents` seam and folded identically to file
        definitions (persona, sanitized toolFilter, alias-resolved model,
        maxDepth 3, background pin, deferred-MCP preload, foreground collect /
        background continuable); dispatch targets the `spawn` provider, so the
        AgentProvider fork-inheritance semantics are not used. Mounting a
        plugin's agents without a namespacePrefix leaves them undiscoverable
        to the Task tool (back-compat escape hatch, not a supported dispatch
        mode). First-party exercise: the official dsh-cc-agents plugin
        (packages/plugin/dsh-cc-agents, shipped via the repo-root `dsh-cc`
        marketplace) dispatches by scoped id end-to-end —
        dsh-cc-agents:critic / dsh-cc-agents:executor mount from the
        real plugin dir and are pinned by plugin-agents.spec.ts and the
        loader's dsh-cc-agents.spec.ts. Delegation discipline is
        prompt-taught across the Task description, the background-loop
        system-prompt section, both spawn-result texts, the resume-pins
        send_message advisory and list_agents annotations, the repo
        CLAUDE.md, and the dsh-cc-agents orchestration skill: one task, one
        instance — send_message continues only the child's current
        assignment, and every new task is a fresh subagent_fork spawn.

