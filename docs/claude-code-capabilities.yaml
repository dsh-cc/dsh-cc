    deviation:
      kind: divergent
      summary: >-
        The continuation is a model-visible plugin-source next-step user
        message (CC resumes invisibly inside the same response), and
        user-configured blocking Stop hooks are suppressed while
        output-ceiling recovery is in progress (CC never runs Stop
        mid-recovery either; the transcript still records one sticky
        max-tokens turn/end).

