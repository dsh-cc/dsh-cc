# docs/claude-code-capabilities.yaml — machine-readable Claude Code capability manifest.
# Authored source of truth (spec: docs/plans/2026-09-03-claude-code-capability-manifest.md §4, §6).
# docs/cc-parity-matrix.md and the README parity block are GENERATED from this file;
# hand edits there fail CI. Edit loop: edit this file → run pnpm docs:parity → commit all.
manifest_version: 1

baseline:
  upstream: claude-code
  sources:
    - id: cc-docs
      kind: context7
      ref: /websites/code_claude
      url: https://code.claude.com/docs
      retrieved: '2026-09-03'
    - id: cc-repo
      kind: context7
      ref: /anthropics/claude-code
      url: https://github.com/anthropics/claude-code
      retrieved: '2026-09-03'
  freshness_threshold_days: 120

categories:
  - { id: engine, title: Engine subsystems }
  - { id: hooks, title: Hook events }
  - { id: commands, title: Command surface }
  - { id: sessions, title: Sessions and context }
  - { id: memory, title: Memory and CLAUDE.md }
  - { id: skills, title: Skills }
  - { id: subagents, title: Subagents }
  - { id: mcp, title: MCP }
  - { id: plugins, title: Plugins and marketplaces }
  - { id: settings, title: Settings }
  - { id: permissions, title: Permissions }
  - { id: models, title: Models }
  - { id: workspace, title: Workspace }
  - { id: ux, title: Interactive UX }

upstream_dependencies:
  session-file-snapshot-seam:
    title: Session file-snapshot seam
    problem: >-
      dsh sessions persist a jsonl/sqlite projection; there is no per-prompt
      snapshot store of edited files to anchor a rewind against.
    cc_contract: >-
      Every prompt checkpoints files about to be edited; /rewind (or Esc Esc)
      restores code, conversation, or both; checkpoints persist across resumed
      sessions and do not cover Bash-side changes.
    refs:
      - https://code.claude.com/docs/en/checkpointing
    needed_for:
      - sessions.checkpointing
      - commands.rewind
  schedule-cron-selector:
    title: Cron-expression selector for dsh-schedule
    problem: >-
      dsh-schedule supports after_seconds / at / every_seconds (>=300s) but has
      no cron-expression selector, so ScheduleCronTool parity is unreachable.
    cc_contract: >-
      Claude Code scheduled reminders accept cron expressions as selectors.
    refs: []
    needed_for:
      - engine.schedule
  precompact-seam:
    title: PreCompact interception seam in dsh-compaction
    problem: >-
      dsh-compaction has no interception point where a user-configured hook
      could run before compaction fires, so the PreCompact event cannot bridge.
    cc_contract: >-
      Claude Code fires PreCompact hooks before automatic or manual
      compaction, letting hooks inject or transform context.
    refs: []
    needed_for:
      - hooks.pre-compact
  tasks-todo-seam:
    title: Human-facing todo-list seam for /tasks
    problem: >-
      dsh-tool-todo is model-facing and the TUI renders the todo panel, but
      human-facing /tasks still lists background jobs only.
    cc_contract: >-
      Claude Code's /tasks surfaces the session todo list to the human user.
    refs: []
    needed_for:
      - commands.tasks
  memory-fsinfo-mtime:
    title: Memory freshness — FsInfo mtime seam
    problem: >-
      CC threads mtimeMs through recall and ages memories (memoryAge); the
      current dsh-fs seam does not expose mtime, so both are deferred.
    cc_contract: >-
      Claude Code memory recall orders by file mtime and exposes a memoryAge
      signal so stale memories age out of prominence.
    refs: []
    needed_for:
      - memory.core
  notification-seam:
    title: Notification seam in deepseek-harness
    problem: >-
      No notification seam exists in deepseek-harness (bell/OS/iterm);
      shipping notifications needs a new design.
    cc_contract: >-
      Claude Code emits desktop/terminal notifications for attention-needed
      moments (bell, OS notification, iTerm2 escape sequences).
    refs: []
    needed_for:
      - engine.notifications
  permission-mode-catalog-pin:
    title: Upstream catalog pin of permission/mode session events
    problem: >-
      The plugin registers permission/mode into KNOWN_SESSION_EVENT_TYPES via a
      runtime Set.add at load; bumping the harness's own compiled catalog is an
      upstream polish.
    cc_contract: >-
      Permission-mode session state persists across process restarts, not just
      within the registering process.
    refs: []
    needed_for:
      - permissions.rules
  upstream-issue-2124:
    title: Upstream harness issue #2124 — fork + background Task
    problem: >-
      Fork children remain foreground one-shot until upstream harness issue
      #2124 resolves; fork + run_in_background is rejected with an error naming
      the issue.
    cc_contract: >-
      Claude Code Task supports the fork provider in continuable background
      mode with the same agentId-addressable loop as spawn.
    refs: []
    needed_for:
      - subagents.task-tool

