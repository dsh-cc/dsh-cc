  # ── workspace ───────────────────────────────────────────────────────────
  workspace.worktree-ecosystem:
    title: Worktree ecosystem (include-copy, PR references, path form)
    category: workspace
    plane: preset
    upstream:
      summary: >-
        `.worktreeinclude` copies matched, git-check-ignore-confirmed files
        (gitignore subset: comments, `!` negation, trailing `/`, `*`, `?`,
        `**`, plus CC's `**/`-piercing rule) into every newly created
        worktree; `--worktree` accepts `#<n>` PR references and GitHub PR /
        GitLab MR URLs, fetching the head from origin (5s cap, clear failure
        when unresolvable) and creating at `.claude/worktrees/pr-<n>` on
        `worktree-pr-<n>` with PR-reuse never resetting; EnterWorktree gains a
        `path` form that adopts an existing directory directly under the
        convention dir and ALWAYS asks outside it — "don't ask again"
        persistence cannot suppress the prompt, only bypassPermissions skips
        it.
      refs: []
    dimensions:
      recognized: true
      mounted: true
      behavioral: partial
      ux: partial
    evidence:
      - { type: source, path: packages/preset/cc/agent.cordis.yml, anchor: "- id: tool-git-worktree" }
      - { type: source, path: packages/workspace/tool-git-worktree/src/include.ts, anchor: "copyIncludedFiles" }
      - { type: test, path: packages/workspace/tool-git-worktree/tests/include.spec.ts }
      - { type: source, path: packages/workspace/tool-git-worktree/src/pathform.ts, anchor: "resolveAdoptPath" }
      - { type: test, path: packages/workspace/tool-git-worktree/tests/pathform.spec.ts }
      - { type: test, path: packages/launcher/tui/tests/worktree.spec.ts, anchor: "WS-6 PR references" }
    deviation:
      kind: downgrade
      summary: >-
        `.worktreeinclude` copy is tool-side only: launcher `--worktree`
        sessions (pre-build plain JS) have no include-copy — cloning the
        matcher would be the first semantic duplication (a parser, not a
        command string). PR-reference worktrees also skip the reuse-reset (CC
        parity). EnterWorktree keeps allowing `name` creation from within a
        worktree (WS-1 pinned root), strictly more permissive than CC.

  workspace.worktree-launcher:
    title: Worktree launcher (--worktree)
    category: workspace
    plane: host
    upstream:
      summary: >-
        Plain-JS launcher creates or reuses `.claude/worktrees/` sessions via
        `--worktree`, with the same creation hardening as the tool side:
        common-dir root pinning, repository-local filter-driver
        neutralization, symlink refusal, and the adoption identity check on
        named reuse.
      refs: []
    dimensions:
      recognized: true
      mounted: true
      behavioral: partial
      ux: partial
    evidence:
      - { type: source, path: packages/launcher/tui/bootstrap.mjs, anchor: "export function worktreeIdentityRefusal" }
      - { type: test, path: packages/launcher/tui/tests/worktree.spec.ts }
    deviation:
      kind: downgrade
      summary: >-
        Launcher `--worktree` sessions keep git-direct creation: the
        pre-build bin/dsh-cc.js cannot run hooks or read the settings
        cascade, and there is no include-copy, no baseRef freshness, and no
        PR-reference support (WS-4/WS-6 scope).

  workspace.worktree-lifecycle:
    title: Worktree lifecycle (settings, locks, sweep, base selection)
    category: workspace
    plane: preset
    upstream:
      summary: >-
        `worktree` settings section (`baseRef` fresh/head,
        `cleanupPeriodDays`) shared through the settings cascade; session
        locks (`git worktree lock --reason "dsh-cc session <id>"`) taken at
        EnterWorktree create and launcher-managed session start and released
        at exit/remove/TUI dispose; `baseRef: fresh` branches new worktrees
        from the cached origin/HEAD with a 24h-stale refresh fetch (5s cap);
        a boot-time sweep removes clean, unpushed-free worktrees older than
        the window and reports stale dsh-cc-prefixed locks as advisories
        (never auto-releases them); named reuse hard-resets to the fresh
        base when the tree is clean and all its commits are merged; quitting
        a managed, user-unnamed session with a fully clean tree (zero
        changes, zero commits) removes the worktree, deletes its owned
        branch, and tombstones the resume anchor silently.
      refs: []
    dimensions:
      recognized: true
      mounted: true
      behavioral: partial
      ux: partial
    evidence:
      - { type: source, path: packages/preset/cc/agent.cordis.yml, anchor: "- id: tool-git-worktree" }
      - { type: source, path: packages/launcher/tui/worktree-lifecycle.mjs }
      - { type: test, path: packages/workspace/tool-git-worktree/tests/lifecycle.spec.ts }
      - { type: test, path: packages/launcher/tui/tests/worktree-lifecycle.spec.ts }
      - { type: source, path: packages/ui/tui/src/harness/worktree-exit.ts }
      - { type: test, path: packages/ui/tui/tests/driver-worktree-exit.spec.ts }
    deviation:
      kind: downgrade
      summary: >-
        The launcher cannot load the settings cascade (pre-build,
        dependency-free): it performs a fail-open JSON subset read of the
        user/project/local settings files only — flag/policy layers and
        hot-reload are cascade-side. dsh-cc never auto-releases stale locks
        (no trustworthy cross-process liveness oracle): killed sessions
        surface as advisory output, never silent deletion, unlike CC.
        WorktreeCreate/WorktreeRemove hooks and PR-reference reuse are
        tracked on `hooks.worktree-events` / `workspace.worktree-ecosystem`
        (WS-6); the launcher-side hook gap is documented there.

  workspace.worktree-tools:
    title: Worktree tools (EnterWorktree/ExitWorktree)
    category: workspace
    plane: preset
    upstream:
      summary: >-
        Enter/exit isolated git worktrees mid-session with creation
        hardening: the repository root is pinned to the git common dir,
        repository-local filter drivers are neutralized before `git worktree
        add` (unreadable local config, includeIf, and ambiguous filter names
        refuse), symlinked creation paths refuse, and adopting an existing
        directory verifies its git identity. Exit keeps a fail-closed gate
        with discard confirmation.
      refs: []
    dimensions:
      recognized: true
      mounted: true
      behavioral: partial
      ux: partial
    evidence:
      - { type: source, path: packages/preset/cc/agent.cordis.yml, anchor: "- id: tool-git-worktree" }
      - { type: test, path: packages/workspace/tool-git-worktree/tests/worktree.spec.ts }
      - { type: test, path: packages/workspace/tool-git-worktree/tests/harden.spec.ts }
      - { type: test, path: packages/workspace/tool-git-worktree/tests/integration.spec.ts }
    deviation:
      kind: downgrade
      summary: >-
        Pending vs CC: git writes to the shared `.git`
        (worktree add/remove, branch ops) require a sandbox escalation; the
