          unmounted outside preset/cc; cursor hooks map through the verified dialect
          table in hooks.ts with unmapped events skipped as warnings;
          commands accept .txt on the cursor flavor; mcp.json default
          discovery, the mcpServers array form, and `dir/**` glob expansion
