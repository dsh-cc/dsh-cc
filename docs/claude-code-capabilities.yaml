  engine.post-edit-auto-verify:
    title: Post-edit auto-verify ([auto-verify] append)
    category: engine
    plane: preset
    upstream:
      summary: >-
        CC has no equivalent surface — the closest, PostToolUse
        `updatedToolOutput`, REPLACES the whole tool-result content with a
        single text block and cannot append. The appended `[auto-verify]`
        text is a non-CC transcript element (same divergence class as hook
        `additionalContext`); a known model self-rerun double-spend of the
        verify command after a failure tail is documented, not engineered
        against in v1.
      refs: []
    dimensions:
      recognized: true
      mounted: true
      behavioral: full
      ux: partial
    evidence:
