    deviation:
      kind: downgrade
      summary: >-
        Rule engine + dangerous-command/path risk classifier, durable modes
        (default/acceptEdits/plan/auto/bypassPermissions via /permissions),
        plan deny with exit_plan_mode guidance, bypassPermissions pinning
        danger-full-access with resumeSandbox restore, and the always-allow
        derived-rule persistence all work. `auto` mode additionally gains an
        opt-in, escalate-only LLM risk-classifier stage: a one-shot auxiliary
        model verdict over tool name + rendered parameters (never tool
        results, input wrapped as an explicit DATA block the model is
        instructed never to repeat, quote, or follow), fail-to-ask on every
        classifier failure, `$defaults`
        soft-deny prose expansion, a verdict LRU cache, and durable
        `permission/classifier` session audit events (armed only when enabled,
        an llm service is mounted, and the alias route resolves). Read-only
        tool calls are exempt: they never invoke the classifier (the legacy
        auto path applies). Verdict parsing stays strict and fail-closed — a
        malformed output yields the constant reason "classifier output
        unparseable" (model output never reaches the modal; the audit record
        is digest-only). A per-route consecutive-failure circuit breaker
        (threshold 3, keyed provider/model) opens the stage for a failing
        lane: no further classifier calls on that route, one warn per process,
        one `breaker` audit event per session, reset by a settings change
        (rebuild). The breaker is restart-durable within a session: the first
        call of a session seeds the per-route streak from the durable log
        (attributed events only; a restored streak ≥ threshold opens at seed
        time). An open breaker surfaces one visible TUI fallback notice per
        session (live-appended `breaker` events only — never replayed logs),
        and caller-cancelled classifications are tagged `cancelled`, never
        breaker-counted. Raw model output is debuggable via the opt-in
        `DSH_PERMISSION_CLASSIFIER_DEBUG=1` process-log channel
        (`[dsh:classifier:raw]`, truncated to 2 KiB — never session events).
        Defaults: `timeoutMs` 8000, verdict budget 1024 tokens. The UI honors
        `permissions.defaultMode`: statusline,
        session switch, Shift+Tab cycle start, and the /permissions picker all
        fall back to the live merged settings default (fold precedence — a
        recorded session mode still wins), with the cycle clamped to its
        members.
        Settings-surface deviation: the auto-mode section is delivered as
        `permissions.autoMode` — an `autoMode` key inside the existing
        `permissions` namespace (camelCase key in a kebab namespace, like
        `defaultMode`), NOT Claude Code's root-level `autoMode` key, because
        top-level settings namespaces must be kebab-case upstream. Other
        documented CC auto-mode divergences are RESOLVED (2026-09-23
        waterfall-parity slice): explicit ask rules are no longer proxied to
        allow in auto (strict-rule auto — matched ask rules prompt at any
        risk level), and content evaluation is deny-first (behavior outer
        deny→ask→allow, sources inner), in every mode. Always-allow
        grant synthesis is verified-matching: every persisted rule provably
        matches the call that produced it (env/wrapper-stripped commands fall
        back to a raw-prefix rule; WebFetch rules derive from untruncated args
        and never silently broaden to whole-tool), and write-time subsumption
        dedup plus `/permissions lint` keep the user allow list from
        accumulating covered rules — all persisted edits go through the
        settings-cascade raw user-layer seam, so higher-layer rules are never
        smeared into the user file. Remaining
        Waterfall-parity slice (2026-09-23): rule SUSPENSION in auto mode
        (`filterAutoAllowRules` — whole-tool bash/PowerShell allows,
        effectively-blanket bash content allows, interpreter and
        package-runner prefixes, Task/Agent/subagent/subagent_fork allows;
        hard override via `permissions.autoMode.classifyAllShell`, consumed
        through the single `effectiveRuleSet(mode)` service seam and
        annotated in `/permissions` as "suspended in auto mode"); a
        three-tier bash risk classifier (new MEDIUM tier:
        force-push, hard reset, force-recursive remove of ordinary targets,
        package publish, resource deletion — configurable via
        `permissions.mediumPatterns`, replace semantics); DENY-FIRST content
        ordering (content deny beats content allow and whole-tool ask in
        every mode); grant-on-ask ("Allow for this session" now applies to
        rule-derived asks in every non-plan mode); the LLM stage arbitrates
        passthrough-class LOW calls only (never rule-derived asks); MEDIUM
        is never arbitrated by the LLM in this slice — it asks with the risk
        reason when the waterfall passed it through. Config-slot parity slice
        (2026-09-23): `permissions.autoMode` gains `allow` and `environment`
        slot lists (absence-preserving unions, `$defaults` position-preserving
        expansion via `expandSlot`); the classifier system prompt teaches
        evaluation order soft-deny rules → allow exceptions → environment
        trust boundary (the hard_deny section arrives with the action-level
        deny slice); the verdict cache key digests ALL THREE slot lists; and
        the cascade assembles `permissions.autoMode` from TRUSTED sources ONLY
        (user, --settings flag, managed policy — project and local, the
        repo-carried layers, are skipped for this key alone, D12), so a
        cloned repository cannot teach the classifier its own trust boundary;
        /auto-mode (commands.auto-mode) exposes the defaults and the
        effective trusted-scoped slice. Transcript-aware classifier slice
        (2026-09-23): the classifier input becomes a bounded transcript
        window — `<user_intent>` (human-origin user messages only; plugin
        injections filtered; first message always pinned + last 4, 400-char
        per-message cap), `<project_instructions>` (session-cwd AGENTS.md
        else CLAUDE.md, ≤1024 chars, read once per stage build),
        `<tool_history>` (last 10 non-read-only tool calls), and an optional
        work-discarding `<context>` git-status enrichment (git reset
        --hard / clean / checkout -- / restore, rm -r/-f, rmdir ⇒ bounded
        porcelain snapshot; any failure omits the section) — ahead of the
        fenced tool call, empty sections omitted, the ASSEMBLED string
        hard-capped at 8192 chars (the tool-call payload keeps its 4096
        cap). The system prompt gains intent rules (judge AUTHORIZATION by
        what the user asked, not mere relatedness; a question is not a
        directive; one earlier approval is not a pattern; conservative when
        the intent section is empty — re-expressed prose, never
        CC-verbatim). The verdict cache key digests the context parts (any
        change busts it). Stage eligibility widens to passthrough-class LOW
        and MEDIUM (rule asks are still never arbitrated), and
        enabled-but-unavailable (unarmable, route missing, breaker open)
        now FAILS TO PROMPT: an eligible call returns `ask` with an
        availability reason instead of the legacy silent allow (D11). A8
        stale-mode guard: the effective mode (including the defaultMode
        fallback) is captured before the classify await and re-folded
        after; leaving `auto` discards the verdict with a `stale-mode`
        audit failure that is never breaker-counted. Audit events gain a
        ≤120-char control-char-stripped `reason`. `classifier.secondPass`
        (default FALSE, absence-preserving, D13) enables ONE reconsider
        call on a non-failure ask verdict — only ask→allow is possible,
        never the reverse; the audit marks `secondPass: true`. Input-layer
        prompt-injection probe slice (2026-09-23, S7/D8): `auto` mode gains a
        one-shot auxiliary-model probe over the TEXT blocks of executed tool
        RESULTS (the layer the pre-execute classifier is blind to) —
        default scan scope `read`/`read_image`/`bash`/`web_fetch`/
        `web_search` plus every `mcp__*` tool (CC parity; CC spellings
        matched via ccToolAliases), fully replaceable via
        `autoMode.probe.toolPatterns` (exact names or trailing-`*` prefix
        patterns). Verdict contract `{injection, reason}`, parsed
        defensively (fence-stripped JSON; malformed ⇒ fail-open pass),
        probe `reason` capped at 120 chars with control chars stripped in
        both the audit record and the warning (secret-echo mitigation);
        probe input = text blocks only (non-text skipped), first 3072 +
        last 1024 chars with an elision marker; 256-token verdict budget,
        5000 ms default timeout (`probe.timeoutMs`), route
        `probe.route` (default 'haiku'). The listener is DEFAULT order and
        scans the PRE-REWRITE ORIGINAL result content (deliberate: the
        context-crusher's prepend listener composes AROUND the probe, so the
        original is the only CCR-independent vantage). Delivery is the
        `additionalContexts` SIDEBAND (edit-recovery-hint idiom): a flag
        appends a security-notice UserMessage to the downstream fold
        decision's additionalContexts — never into content, so a sideband
        cannot be clobbered by content rewriters and survives listener-order
        races (CC adjacency of warning-to-content is approximated); existing
        downstream contexts are preserved, frozen results are never mutated,
        and value-replacing accepts carry the warning too (the runtime merges
        additionalContexts onto replaced results). Fail-open everywhere
        (advisory layer): timeout/error/malformed ⇒ pass-without-warning +
        audit failure + per-route breaker accounting; unarmable (no llm
        stream or route) ⇒ pass + warn-once per process + `unarmed` audit;
        the per-route breaker (threshold 3, the classifier-breaker machinery
        shared with the classifier stage, seeded once per session from the
        durable log) passes results through with one `breaker` audit per
        session + one process warn, reset by a settings change. The probe
        NEVER runs outside effective `auto` mode (A8: the mode fold happens
        at listener time, and a mid-flight mode change out of `auto` audits
        `stale-mode` — never breaker-counted). Durable `permission/probe`
        session audit events
        (registered type) are digest-only (sha256 of the probe input) by
        default; `classifier.auditFullText` (full-text audit + review slice,
        2026-09-23, S5/D10 — absence-preserving, default FALSE) makes BOTH
        event types carry the raw rendered input (≤8192 chars), readable via
        `/auto-mode review full`; the flag is hot-reloadable (the next
        audited event picks it up without a restart). Hybrid verdict space
        slice (2026-09-23, S4/D4):
        `permissions.autoMode` gains `hard_deny` (absence-preserving snake_case
        slot, `$defaults`-expanded at consumption; the built-in list holds the
        two UNCONDITIONAL rules — credential exfiltration and
        permission-system tampering/audit falsification — while the
        intent-dependent data-destruction rule stays a soft_deny, A10), and
        the classifier verdict space gains `deny`: the system prompt teaches
        evaluation order hard_deny → soft_deny → allow exceptions, with allow
        exceptions NEVER softening a hard-deny match, and a `deny` verdict
        REQUIRES a `rule` field citing the exact matched hard-deny rule text —
        `parseVerdict` structurally enforces the citation (an uncited,
        non-matching, or near-miss deny — trailing whitespace, unicode quotes,
        case variance — DOWNGRADES to `ask` with the downgrade recorded in the
        reason, never upgraded to `allow`), and the verdict cache key digests
        the hard_deny list so a mutated slot set never replays a deny. A
        `deny` never earns a reconsider pass (secondPass is ask-only). The
        stage outcome `{kind:'deny', reason, rule}` rides the existing
        deny→error-tool-result delivery wrapped with a good-faith boundary
        instruction (D6 — the turn continues; nothing halts), and the audit
        event carries the deny verdict, the cited `rule`, and the registry
        `callId`. Backstop (D5/A2/A16): per-session consecutive (3) and total
        (20) deny counters are folded seed-once from the durable
        `permission/classifier` log plus in-process records — the consecutive
        streak is reset ONLY by a REAL non-deny verdict
        (`failure === undefined`); synthetic `unarmed`/`breaker`/`stale-mode`
        records never reset it, and the fold window starts after the most
        recent `failure: 'trip'` marker. Crossing a threshold trips ONCE per
        window: one `trip` audit marker, then auto mode is PAUSED with a
        parameterized notice carrying honest provenance ("Auto mode paused:
        the permission classifier's denial threshold was reached…", never the
        "changed by the user" template) and the session downgrades to
        `default`. Recorded deviation vs CC: no automatic resume after
        approval — re-entry is manual (`/permissions auto`), and the counters
        restart from zero on re-entry (the fold re-windows past the trip
        marker). Remaining
        vs CC: managed/enterprise remote settings, UI mode cycle; the upstream
        permission/mode catalog pin is an upstream polish. Subagent-handoff
        slice (2026-09-23, S6/D9): OUTBOUND — in `auto` mode every
        Task/Agent/subagent/subagent_fork allow rule is suspended (D1), so a
        spawn call at LOW risk passthrough reaches the armed classifier, whose
        input now renders the delegation `prompt` field FIRST (512-char cap,
        field names verified against the Task tool schema; the label and
        remaining args follow) so the risk signal is prominent. RETURN — two
        warn-only arms on the spawn tool's post-execute result, never
        discarding or rewriting anything: (a) when the child session is
        resolvable (`result.value.agentId` + the `agents` registry, the
        one-shot-ledger face), the child's own `permission/classifier` +
        `permission/probe` audit events are folded and the parent is warned
        via `additionalContexts` when the child recorded any deny verdict,
        any breaker/trip failure, or ≥5 escalated (ask) verdicts — the
        warning names the child label and the counts; an unresolvable child
        under a resolver that THREW logs a debug note only (never a
        fabricated warning); (b) ALWAYS, the returned report text is screened
        through the SAME S7 probe instance (`screen`, the shared
        mode-gated/enabled-gated core under `scan` — same lane, breaker, and
        audit) and a flag appends a security-notice warning telling the
        parent to treat the report as suspect and re-anchor on the user's
        actual request. Both arms run only in effective `auto` mode (A8
        fold), fail open, never throw into the waterfall, and never mutate
        frozen results; a hard-gated red test proved child-session
        resolution BEFORE the listener shipped, so arm (a) ships enabled.
        dsh-cc extension: structured_output report channel classified
        read-only by default (both registrars are validate-and-echo report
        channels), so memory-lane structured reports never reach the
        classifier and never ask in headless children. Critical-bash
        denylist slice (2026-09-23, C3): a curated critical tier — force/recursive
        remove of root or home, and the fork-bomb define-form — plus an
        APPEND-ONLY `permissions.criticalDeny` settings list (invalid regex
        sources skipped with a debug log, never thrown) are mounted as
        bypass-immune deny rules labelled `[curated]`, so these two denies
        survive every permission mode (including bypassPermissions over
        danger-full-access), `classifierEnabled: false`, and a
        `permissions.dangerousPatterns` replacement; entries also stay in the
        classifier table (double-deny is harmless). CC has NO such tier —
        this is a deliberate dsh-cc security extension, not parity drift;
        `sudo` and `curl | sh` are deliberately NOT reclassified so
        bypassPermissions keeps its escape value.

