  engine.compaction-cost-gate:
    title: Cost-gated plan-step compaction
    category: engine
    plane: preset
    upstream:
      summary: >-
        Not an upstream CC surface: a dsh-cc extension (plan
        docs/plans/2026-09-20-cost-gated-plan-step-compaction.md). A
        todo_write completion arms a plan-step boundary; at the agent/status
        idle seam the cost gate compares projected input-token savings against
        the prompt-cache rewrite price plus unamortized debt and fires
        compactNow on the latched root session only on a pass. Ships dark
        (enabled: false, mode: dry-run); the ledger makes the gate's economics
        observable without flipping behavior.
      refs: []
    dimensions:
      recognized: true
      mounted: true
      behavioral: full
      ux: full
    evidence:
      - { type: source, path: packages/preset/cc/agent.cordis.yml, anchor: "- id: compaction-cost-gate" }
      - { type: test, path: packages/compaction/compaction-cost-gate/tests/composition.spec.ts }
      - { type: test, path: packages/compaction/compaction-cost-gate/tests/gate.spec.ts }
    deviation:
      kind: divergent
      summary: >-
        Not an upstream CC surface: a dsh-cc extension. Expected busy/cancelled
        compaction failures are ledgered as skips, never counted by the
        breaker; the fuse pauses the feature with one model-visible notice
        pointing at manual /compact.

  engine.context-compression:
    title: CCR tool-output compression (context-crusher)
    category: engine
    plane: preset
    upstream:
      summary: >-
        Reversible compression of large tool results (Compress-Cache-Retrieve):
        grep/log-shaped outputs are compressed, the original is cached
        content-addressed under $DSH_HOME, and a context_retrieve tool
        restores it via a ccr:// hash marker.
      refs: []
    dimensions:
      recognized: true
      mounted: true
      behavioral: full
      ux: full
    evidence:
      - { type: source, path: packages/preset/cc/agent.cordis.yml, anchor: "- id: context-crusher" }
      - { type: test, path: packages/context/context-crusher/tests/composition.spec.ts }
      - { type: test, path: packages/context/context-crusher/tests/composition-reducer.spec.ts }
    deviation:
      kind: divergent
      summary: >-
        Not an upstream CC surface: a dsh-cc extension shipped flag-gated
        (enabled: false, mode: dry-run by default) so savings are measured
        before any replacement. An optional evidence-preserving reducer
        escalates noisy build/test output the deterministic router declines
        to a cheap-lane receipt (a failing-test list with verbatim evidence
        quotes), verified deterministically before substitution (schema,
        exact quotes, exit consistency, size gain, count consistency) with
        original-bytes fallback on any failure. The reducer ships dark
        (reducer-enabled: false) with knobs reducer-commands,
        reducer-max-input-tokens (30000), reducer-min-savings-ratio (0.5),
        reducer-max-tokens (1024), reducer-timeout-ms (10000), and
        reducer-alias ('haiku'; unrouted or inherited-provider lanes are
        skipped, never billed to the parent route).

