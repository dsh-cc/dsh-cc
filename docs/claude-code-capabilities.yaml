      refs:
        - { source: cc-docs, path: /docs/en/agent-sdk/typescript, retrieved: '2026-09-23' }
        - { source: cc-docs, path: /docs/en/workflows, retrieved: '2026-09-23' }
    dimensions:
      recognized: true
      mounted: true
      behavioral: divergent
      ux: partial
    evidence:
      - { type: source, path: packages/preset/cc/agent.cordis.yml, anchor: "- id: tool-workflow-cc" }
      - { type: source, path: packages/preset/cc/agent.cordis.yml, anchor: "- id: workflow-worker-thread" }
      - { type: source, path: packages/core/tool-workflow/src/index.ts }
      - { type: source, path: packages/core/tool-workflow/src/commands.ts }
      - { type: source, path: packages/ui/tui/src/harness/workflow-row.ts }
      - { type: source, path: packages/subagent/workflow-journal/src/index.ts }
      - { type: source, path: packages/subagent/workflow-journal/tests/spike.spec.ts }
    deviation:
      kind: divergent
      summary: >-
        Same-session replay (`resumeFromRunId`) implemented via the
        `cc-workflow-journal` provider — frozen-until-first-miss over the
        per-run result journal. Saved workflows mount as `/<name>` slash
        commands at session start (project dir shadows user dir), and a
        passive cc-tui progress row echoes phase/elapsed/agent counts from
        the `workflow/*` cordis events. Residual: per-user directory mapped to
        `$DSH_HOME/workflows/` (not `~/.claude/workflows/`); monorepo chain
        loading of every `.claude/workflows/` up to the repo root (CC v2.1.178)
        not implemented — cwd-level only; CC built-in workflows absent;
        `taskId === runId` aliasing with harness-format ids (CC prefix `wf_`);
        receipt omits `transcriptDir`/`scriptPath`/`sessionUrl`, no-start
        receipts omit `taskId`; receipt `warning?` extended to saved-script
        name disagreement; `ultracode`'s upstream session-effort side effect
        absent (opt-in trigger only); one-active-run constraint; no
        `/workflows` runs panel, save dialog, or pause/cancel keys; no
        `/reload-skills`-style mid-session re-read (new saves mount next
        session, runnable immediately by `name`); the command scan roots at
        `process.cwd()` while the tool resolves `name` against the session
        header cwd (divergence only when they differ); the progress row is
        process-scoped without session attribution (the payloads carry none);
        TUI-local command names silently shadow same-named saved workflows;
        command-mount skip surfacing is logger-grade. Residual footnotes:
        cross-session (and `claude --resume`-class) replay remains
        unimplemented; the cache key is the request triple
        (prompt + outputSchema + agentOptions), intentionally stricter than
        CC's prompt-only keying; durable descriptors and the subagent
        lifecycle identity name the provider `cc-workflow-journal`; the
        durable agent-start/agent-end records gain an additive
        `cached: boolean` field.

